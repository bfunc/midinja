name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows only for now (the user tests on Windows); the macOS job comes back later.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macos" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        shell: bash
        run: |
          ctest --test-dir build -C Release --output-on-failure
          T=$(find build -type f \( -name midinja_tests -o -name midinja_tests.exe \) | head -1)
          "$T" demo-riff.mid

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter Midinja.exe | Where-Object FullName -like '*Standalone*' | Select-Object -First 1
          $vst = Get-ChildItem build -Recurse -Directory -Filter Midinja.vst3 | Select-Object -First 1
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName dist/Midinja.exe
          Copy-Item $vst.FullName dist/Midinja.vst3 -Recurse
          Compress-Archive -Path dist/Midinja.exe, dist/Midinja.vst3 -DestinationPath Midinja-windows.zip

      - name: Package (macOS)
        if: matrix.name == 'macos'
        shell: bash
        run: |
          APP=$(find build -type d -name Midinja.app -path '*Standalone*' | head -1)
          VST=$(find build -type d -name Midinja.vst3 | head -1)
          codesign --force --deep -s - "$APP"
          codesign --force --deep -s - "$VST"
          lipo -info "$APP/Contents/MacOS/Midinja"
          mkdir -p dist && cp -R "$APP" "$VST" dist/
          ditto -c -k --keepParent dist Midinja-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Midinja-${{ matrix.name }}
          path: |
            Midinja-${{ matrix.name }}.zip
            demo-riff.mid
          retention-days: 14

  # Every push to main refreshes the "latest" pre-release; a v* tag makes a real release.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp art/Midinja-windows/Midinja-windows.zip out/
          cp art/Midinja-macos/Midinja-macos.zip out/ 2>/dev/null || true
          cp art/Midinja-windows/demo-riff.mid out/
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" out/* --title "Midinja $GITHUB_REF_NAME" --notes "Standalone app and VST3 for Windows. See the README for install notes."
          else
            gh release delete latest --cleanup-tag -y || true
            gh release create latest out/* --prerelease --target "$GITHUB_SHA" --title "Latest build (main)" --notes "Built from ${GITHUB_SHA::7}. Rolling build, replaced on every push to main. Windows only for now."
          fi
