<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midinja preview</title>
<style>
:root{--bg:#15171c;--panel:#1d2027;--panel2:#242832;--line:#2e3340;--line2:#3d4350;--ink:#e6e8ee;--ink2:#9aa1b2;--ink3:#626a7c;--acc:#ff9f43;--acc2:#5ad1c7;--lock:#f5d76e;--len:#7aa2f7;--rpt:#c792ea;--bad:#e76f51;--prim:#ff9f43;--primbg:#ff9f4322;--ctx:#8a5a2c;--state:#4a5163;--pick:#5ad1c71f}
*{box-sizing:border-box}html,body{margin:0;background:#0d0e11;overflow-x:hidden}
body{font:12px/1.25 "Segoe UI",Inter,system-ui,sans-serif;color:var(--ink);padding:20px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.plug{width:1216px;background:var(--bg);border-radius:12px;border:1px solid #000;box-shadow:0 20px 60px #000a;overflow:hidden;user-select:none}
.row{display:flex;align-items:center;gap:12px;padding:9px 14px}
.song{gap:8px;background:#272b35;padding:20px 14px 9px}
.song .hist{gap:3px}
.song .btn{padding:0 9px}
/* one control height and one centre line: captions (BPM, Key, Versions) sit above their control, out of the flow */
.song .btn,.song .num,.song .fsel,.song .th,.song .pg{height:28px;display:inline-flex;align-items:center;justify-content:center}
.song .ctl{position:relative}.song .ctl>small{position:absolute;bottom:100%;left:0;margin-bottom:3px}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px}.logo b{color:var(--acc)}
.sp{flex:1}.vsep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.btn{padding:7px 10px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.btn:hover{border-color:#4a5163}
.btn.on{background:var(--pick);border-color:var(--acc2);color:var(--acc2)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.35;cursor:default}
.sm{padding:3px 8px}
.xs{padding:2px 7px;font-size:11px}
.dim{color:var(--ink3)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 11px;color:var(--ink2)}
.seg button.on{background:var(--pick);color:var(--acc2);font-weight:700}
.seg.small button{padding:5px 9px}
.seg.xs button{padding:3px 8px;font-size:11px}
.seg button:disabled{opacity:.35;cursor:default}
.gen{display:flex;align-items:center;gap:6px}
.dice:active{transform:translateY(1px)}
.dicegrp{display:flex;align-items:stretch;height:38px;border-radius:9px;overflow:hidden;box-shadow:0 0 0 3px #ff9f4333}
.dice{position:relative;width:48px;border:0;border-radius:0;background:#ff9f4338;display:grid;justify-items:start;align-items:start;padding:3px 0 0 5px}
.dsvg{width:29px;height:29px;display:block;overflow:visible}
.dsvg .dt{fill:#ffc58c}.dsvg .dl{fill:var(--acc)}.dsvg .dr{fill:#d9782a}.dsvg .dp{fill:#2a1a08}
.dice[disabled] .dsvg{filter:grayscale(1);opacity:.6}
.dsvg.spin{animation:dspin .45s cubic-bezier(.3,.7,.4,1)}
@keyframes dspin{0%{transform:rotate(0) scale(1)}45%{transform:rotate(200deg) scale(.82)}100%{transform:rotate(360deg) scale(1)}}
.dicegrp button:focus{outline:none}.dicegrp button:focus-visible{outline:2px solid var(--acc);outline-offset:-3px}.dicegrp .dice:focus-visible{outline-color:#1a1206}
.dpart{position:absolute;right:3px;bottom:3px;padding:1px 3px;border-radius:4px;background:var(--acc);color:#1a1206;font-size:10px;font-weight:700;line-height:1.1;font-family:inherit;pointer-events:none}
.diceall{width:36px;padding:0;border:0;border-left:1px solid #ff9f4366;border-radius:0;background:#ff9f4329;color:var(--acc);font-size:11px;font-weight:700;display:grid;place-items:center}
.diceall:hover:not([disabled]){background:#ff9f4347}
.diceall[disabled]{opacity:.35;cursor:default}
.dice[disabled]{opacity:.35;cursor:default}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl small,.lbl{color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.8px}
.ctl small{white-space:nowrap}
.sel{padding:6px 9px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap;appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,#626a7c 50%),linear-gradient(135deg,#626a7c 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.sel option{background:#242832}
.fsel{text-align:left;color:var(--ink)}.fsel:focus{outline:none}.fsel:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.fmenu{position:fixed;z-index:60;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;display:none;min-width:90px;max-height:320px;overflow:auto;padding:4px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;box-shadow:0 12px 32px #000a;font-size:12px}
.fmenu div{padding:5px 10px;border-radius:6px;color:var(--ink2);white-space:nowrap;cursor:pointer}
.fmenu div.cur{color:var(--acc);font-weight:700}
.fmenu div.hi{background:#ff9f4326;color:var(--ink)}
.fmenu div.cur.hi{color:var(--acc)}
.sel.xs{padding:3px 20px 3px 7px;font-size:11px;background-position:calc(100% - 10px) 50%,calc(100% - 6px) 50%}
.knob{width:32px;height:32px;border-radius:50%;background:conic-gradient(var(--acc) 0 var(--v),#333845 var(--v) 75%,transparent 75%);transform:rotate(-135deg);display:grid;place-items:center;flex:none;cursor:ns-resize}
.knob.t{background:conic-gradient(var(--acc2) 0 var(--v),#333845 var(--v) 75%,transparent 75%)}
.knob i{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:block}
.kv{display:flex;align-items:center;gap:6px}.kv span{color:var(--ink2);font-size:11px}.kv b{font-weight:600}
.mus{display:flex;gap:12px;align-items:center;padding-left:12px;border-left:1px solid var(--line)}
.hist{display:flex;align-items:center;gap:4px}
.th{width:40px;height:26px;border-radius:5px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer}
.th.cur{border-color:var(--ink2)}
.th.empty{opacity:.25;cursor:default}
.th i{position:absolute;width:2px;height:2px;background:var(--ink3)}
.th.cur i{background:var(--ink)}
.th .star{position:absolute;right:1px;top:-2px;font-size:9px;color:var(--lock)}
.pg{padding:3px 5px;border:0;background:transparent;color:var(--ink2)}
.pg[disabled]{opacity:.25;cursor:default}
.tog{display:flex;align-items:center;gap:7px;color:var(--ink2);cursor:pointer}
.sw{width:30px;height:16px;border-radius:999px;background:#333845;position:relative;transition:.15s}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#9aa1b2;transition:.15s}
.tog.on .sw{background:#5ad1c755}.tog.on .sw:after{left:16px;background:var(--acc2)}
.tog.on{color:var(--acc2)}
.num{padding:5px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
input.num{width:64px}
.tabbar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--bg);border-bottom:1px solid var(--line);min-height:40px}
.tb{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);cursor:pointer;font-weight:700;font-size:13px}
.tb:hover{border-color:#4a5163}
.tb.cur{color:var(--ink);border-color:var(--line2);box-shadow:inset 0 -2px 0 var(--ink)}
.tb .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink3);background:transparent;flex:none}
.tb .dot.on{background:var(--acc2);border-color:var(--acc2);box-shadow:0 0 6px var(--acc2)}
.tb.off .dot{border-color:var(--ink3)}
.pal{display:flex;align-items:center;gap:4px;padding-left:12px;border-left:1px solid var(--line);flex-wrap:wrap;row-gap:4px;min-width:0}
.pal .pt{padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);font-weight:700;font-size:12px;line-height:1.2;white-space:nowrap} /* a name never breaks: Groove 2, Crash-in, Fill 1 */
.pal .pt:hover{border-color:#4a5163;color:var(--ink)}
.pal .pt.on{background:#ffffff0d;border-color:var(--trk);color:var(--trk);box-shadow:inset 0 0 0 1px var(--trk)}
.pal .pt.empty{border-style:dashed;color:var(--ink3);opacity:.7}
.pal .pt.locked{border-color:var(--state);box-shadow:inset 0 0 0 1px var(--state)}
.pal .pt.locked.on{border-color:var(--trk)}
.pal .pt i{font-style:normal;font-size:9px;color:var(--ink3);margin-left:3px}
.pal .pt.on i{color:var(--trk)}
.poly .pal{display:none}
.tabset{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:11px}
.tabset .lbl{margin:0 2px 0 8px}
.tabset .lbl:first-child{margin-left:0}
.main{display:flex;align-items:stretch}
.undoredo{display:flex}
.adv-off .advbox,.adv-off .undoredo{display:none}
.rside{width:318px;flex:none;padding:10px 12px 12px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:10px}
.ctxhead{display:flex;align-items:center;justify-content:space-between}
.box{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 10px;display:flex;flex-direction:column;gap:8px}
.box h4{margin:0;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px}
.box h4.iname{font-size:13px;font-weight:800;color:var(--prim);text-transform:none;letter-spacing:0;line-height:1.2}
.box h4.iname small{display:block;font-size:10px;font-weight:400;color:var(--ink3);margin-top:2px}
.box h5{margin:0 0 2px;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center}
.advR{display:flex;flex-direction:column;gap:10px}
.advC{display:flex;flex-direction:column;gap:6px}
.advC input{padding:4px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:11px;width:100%}
.poly #gDice,.poly .advR,.poly .hstrip,.poly .ovbar{display:none}
.plug:not(.poly) .cgen,.plug:not(.poly) .advC,.plug:not(.poly) .clane{display:none}
.knobs{flex-wrap:wrap;gap:8px 10px}
.knobs .kv{gap:5px}.knobs .kv span{font-size:10px}
.form{padding:8px 14px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.ruler{display:flex;gap:6px;align-items:stretch;margin-bottom:6px}
.ruler .addcol{width:30px;flex:none}
.hstrip{display:grid;gap:6px;margin-right:36px;height:72px} /* the lane's height: level 2 never changes size between tabs */
.hbar{min-height:24px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);display:flex;gap:3px;padding:2px;cursor:pointer}
.hbar:hover{border-color:#4a5163}
.hbar .hc{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:4px;background:#2b303a;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;padding:0 4px}
.hbar .hc b{color:var(--ink);font-weight:800}
.hbar .hc.ctx{box-shadow:0 0 0 1px var(--ctx) inset}
.hbar .none{flex:1;text-align:center;color:var(--ink3);font-size:11px;align-self:center}
.pop{position:fixed;display:none;z-index:60;min-width:160px;max-width:420px;padding:8px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);box-shadow:0 10px 30px #000a;color:var(--ink);font-size:12px}
.pop .pi{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--ink2)}
.pop .pi:hover{background:#ffffff10;color:var(--ink)}
.pop .pi.on{color:var(--ink);box-shadow:0 0 0 1px var(--ctx) inset}
.pop .pi b{min-width:22px;color:var(--ink);font-size:13px}
.pop .legend{margin:0;max-width:400px;gap:8px 12px}
.pop h4{margin:0 0 6px;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px}
.pop .grp{padding:4px 0}
.beats #what,.beats .knobs .kv{display:none}
.endkv{position:relative}.endkv>span{position:absolute;bottom:100%;left:0;margin-bottom:3px}
.beats .gstrip{visibility:hidden} /* keep their space: the roll starts at the same height on every tab */
.beats .advR{display:none}
.beats .genrow .gen>.seg{display:none}
.key.drum{font-size:10px;color:var(--ink2)}
.key.drum.root{color:var(--ink)}
.note.drum{left:3px;right:3px;top:4px;bottom:4px;cursor:pointer}
.note.drum.auto{background:transparent;border:1px dashed var(--ctx);box-shadow:none}
.cell.fillz{box-shadow:inset 0 0 0 100px #ff9f430a}
.narrow .song,.narrow .tabbar{flex-wrap:wrap}
.narrow .main{flex-direction:column}
.narrow .rside{width:auto;border-left:0;border-top:1px solid var(--line)}
.narrow .sp{display:none}
.range{position:relative;height:6px;border-radius:3px;background:#333845;margin:9px 6px 5px}
.range b{position:absolute;top:0;bottom:0;background:var(--acc2);border-radius:3px}
.range u{position:absolute;top:-4px;width:12px;height:14px;margin-left:-6px;border-radius:4px;background:#e6e8ee;cursor:ew-resize}
.rl{display:flex;justify-content:space-between;color:var(--ink2);font-size:10.5px}
.offbox .range,.offbox .rl{opacity:.35;pointer-events:none}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:#2a2e38;color:var(--ink3);font-size:9.5px;letter-spacing:.6px;cursor:pointer}
.pill.on{color:var(--acc2);border-color:var(--acc2)}
.gridw{flex:1;padding:8px 12px 10px;min-width:0}
.cols{display:grid;grid-template-columns:var(--kw,44px) repeat(var(--n),1fr)}
.arr{flex:1;display:grid;gap:6px;min-width:0}
.slot{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);cursor:pointer;position:relative;min-width:0}
.arrhint{color:var(--ink3);font-size:11px;padding:6px 2px}
.slot .bn{font-size:10px;color:var(--ink3);min-width:10px}
.slot .tn i{font-style:normal;font-size:9px;color:var(--ink3);margin-left:2px}
.slot .tn:hover i{color:var(--ink)}
.slot .tt{flex:1;width:auto}
.slot .x{margin-left:auto}
.slot .x.cp{font-size:12px}
.slot .cp + .x{margin-left:0}
.slot .cn{flex:1;min-width:0;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .cn b{color:var(--ink);font-weight:800}
.slot.prim .bn{color:var(--prim)}
.slot:hover{border-color:#4a5163}
.slot.ctx{border-color:var(--ctx);color:var(--ink)}
.slot.prim{background:var(--primbg);border-color:var(--prim);color:var(--prim);box-shadow:0 0 0 1px var(--prim) inset}
.slot.locked{border-color:var(--state)}
.slot.locked.prim{border-color:var(--prim)}
.slot.locked.ctx{border-color:var(--ctx)}
.tn{font-weight:700;font-size:13px;min-width:16px;text-align:center;line-height:1.1;padding:2px 4px;border-radius:5px}
.tn:hover{background:#ffffff14}
.tn small{display:block;font-size:9px;font-weight:400;color:var(--ink3);line-height:1.1}
.slot.prim .tn small{color:var(--prim)}
.slot .lk{font-size:11px;opacity:.3;padding:2px 3px;border-radius:4px;line-height:1}
.slot .lk:hover{opacity:.9;background:#ffffff14}
.slot.locked .lk{opacity:1}
.slot .x{border:0;background:transparent;color:var(--ink3);font-size:14px;line-height:1;padding:2px 5px;border-radius:4px}
.slot .x:hover{color:var(--ink);background:#ffffff14}
.slot .pp{position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--acc2);display:none;box-shadow:0 0 6px var(--acc2)}
.slot.playing .pp{display:block}
.slot.prim .tt i{background:var(--prim)}
.aadd{width:30px;height:30px;padding:0;display:grid;place-items:center;color:var(--acc);border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:18px;line-height:1}
.aadd:disabled{opacity:.35;cursor:default}
.arr .aadd{justify-self:start;align-self:center}
.formrow .addcol:empty{display:none}
.tt{width:44px;height:16px;border-radius:4px;background:#00000040;position:relative;overflow:hidden}
.tt i{position:absolute;width:2px;height:2px;background:var(--ink2)}
.msg{color:var(--acc2);font-size:11px;margin:6px 0 0;min-height:14px}
.msg.err{color:var(--bad)}
.msg:empty{display:none}
/* the chord lane: a square + on the left, then blocks on a beat grid */
.clane{display:flex;gap:6px;margin:0}
.clane .lanebox{flex:1}
.addcol{display:flex;align-items:center;justify-content:center;width:30px;flex:none}
.addcol button{width:30px;height:30px;padding:0;display:grid;place-items:center;color:var(--acc);border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:18px;line-height:1}
.addcol button:disabled{opacity:.35;cursor:default}
.lanebox{position:relative;height:72px;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden;touch-action:none}
.tick{position:absolute;top:0;bottom:0;width:1px;background:#ffffff0a}
.tick.bl{background:var(--line2);width:2px}
.tick.ph{background:var(--acc2);width:2px;opacity:.6}
.chord{position:absolute;top:4px;bottom:4px;background:#2b303a;border:1px solid #4a5263;border-radius:7px;display:flex;flex-direction:column;justify-content:space-between;padding:2px 5px;user-select:none;cursor:grab;overflow:hidden}
.chord.locked{border-color:var(--state);background:#2b303a}
.chord.sel{border-color:var(--prim);box-shadow:0 0 0 1px var(--prim) inset;background:#3a3127}
.chord.dragging{cursor:grabbing;opacity:.9}
.chord .crow{display:flex;justify-content:space-between;align-items:center;gap:3px;min-height:16px}
.chord .mid{text-align:center;line-height:1.05;pointer-events:none}
.chord .numr{font-weight:800;font-size:15px;color:var(--ink)}
.chord.sel .numr{color:var(--prim)}
.chord .cname{font-size:10.5px;color:var(--ink2);white-space:nowrap}
.chord .ib{height:16px;min-width:16px;padding:0 3px;font-size:10px;border-radius:4px;background:transparent;border:1px solid transparent;color:var(--ink2);line-height:14px}
.chord .ib:hover{border-color:var(--line2);color:var(--ink)}
.chord .ib.on{opacity:1}
.chord .ib[data-act="lock"]{opacity:.45}
.chord .rh{font-size:9.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.cedge{position:absolute;top:0;bottom:0;width:13px;cursor:ew-resize;z-index:2}
.cedge.l{left:-2px}.cedge.r{right:-2px}
.cedge::after{content:"";position:absolute;top:30%;bottom:30%;left:5px;width:4px;border-radius:2px;background:var(--line2)}
.cedge.r::after{left:auto;right:5px}
.chord.sel .cedge::after{background:var(--ctx)}
.empty-lane{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);pointer-events:none;font-size:11px}
.cgen{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cgen .lbl{margin-left:6px}
.cgen input{flex:1;min-width:150px;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:11px}
.cinsp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--ink2);font-size:11px}
.cinsp .big{font-size:15px;font-weight:800;color:var(--prim);min-width:70px}
.cinsp .big small{display:block;font-size:10px;color:var(--ink3);font-weight:400}
.cinsp .lbl{margin-left:4px}
.gstrip{position:relative;height:0;overflow:visible}
.gstrip.has{height:20px;margin:1px 0}
.gnote{position:absolute;top:2px;height:16px;border:1px dashed #8a5a2c;border-radius:3px;background:#ff9f4312;font-size:10px;color:var(--ink2);padding:0 4px;line-height:14px;overflow:hidden;white-space:nowrap}
.gnote.sel{border-color:var(--prim);color:var(--ink)}
.roll{border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative;touch-action:pan-x pan-y pinch-zoom}
.key{overflow:hidden;font-size:9.5px;color:var(--ink3);display:flex;align-items:center;justify-content:flex-end;gap:4px;padding-right:5px;border-bottom:1px solid #00000040;background:var(--panel)}
.poly .key{font-size:12px}
.key.root{color:var(--acc);font-weight:700}
.key.out{color:#454b58}
.key em{font-style:normal;font-size:8.5px;padding:0 3px;border-radius:3px}
.key em.ct{color:var(--ink2);background:#ffffff0d}

.cell{border-left:1px solid #ffffff08;border-bottom:1px solid #00000040;position:relative;cursor:pointer}
.poly .cell{cursor:default}
.cell.beat{border-left-color:#ffffff1c}
.cell.alt{background:#ffffff05}.cell.rootrow{background:#ff9f430d}.cell.outrow{background:#00000040}
.cell.ph{background:#5ad1c714}
.note{position:absolute;top:2px;bottom:2px;left:2px;border-radius:4px;background:var(--trk,var(--acc));box-shadow:inset 0 -2px 0 #0003;z-index:2;cursor:grab}
.note.colr{background:var(--acc2)}
.note.outn{background:#8a90a0}
.note.chord{cursor:default;background:#8a5a2c}
.note.chord.sel{background:var(--acc)}
.note.chord.croot{box-shadow:inset 3px 0 0 #fff8}
.note.ghost{z-index:1;background:#9aa1b2;opacity:.22;pointer-events:none;box-shadow:none;cursor:default}
.note .rh{position:absolute;right:-3px;top:-2px;bottom:-2px;width:10px;cursor:ew-resize;touch-action:none;z-index:3}
.note .rh:after{content:'';position:absolute;right:4px;top:30%;bottom:30%;width:2px;border-radius:1px;background:#0004}
@media (pointer:coarse){.note .rh{width:18px;right:-9px}} /* a finger needs a wider edge */
.note.draft{opacity:.7;pointer-events:none}
.cell{touch-action:pan-y}
.note.locked{outline:2px solid var(--lock);outline-offset:-1px}
.note::after{content:'';position:absolute;top:0;bottom:0;right:0;width:calc(100% - var(--dur,100%));background:#15171cb8;border-radius:0 4px 4px 0;pointer-events:none} /* the tail after the duration: the note holds its place but is silent */
.note.ghost::after,.note.chord::after,.note.drum::after{display:none}
.note .rat{position:absolute;inset:0;display:flex;pointer-events:none} /* a ratcheted note: its hits split the length */
.note .rat i{flex:1}
.note .rat i+i{box-shadow:inset 3px 0 0 var(--bg)}
.lockic{position:absolute;right:3px;top:50%;transform:translateY(-50%);font-size:8px}
.rootmk{position:absolute;left:2px;top:50%;transform:translateY(-50%);font-size:9px;line-height:1;font-weight:800;color:#15171c;background:#fff;border-radius:3px;padding:1px 3px;z-index:3;pointer-events:none}
.arcs{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible}
.arcs path{fill:none;stroke:var(--acc2);stroke-width:1.5px;opacity:.9}
.kz{display:flex;gap:2px;margin-right:auto;padding-left:3px}
.kz button{width:13px;height:11px;padding:0;border-radius:3px;font-size:10px;line-height:9px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);cursor:pointer}
.kz button:hover:not(:disabled){border-color:#4a5163;color:var(--ink)}
.kz button:disabled{opacity:.3;cursor:default}
.rtools{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:10.5px;color:var(--ink3)}
.rtools .on{background:var(--pick);color:var(--acc2);border-color:#5ad1c755}
.rtools .btn{height:25px;display:inline-flex;align-items:center}
.thead .btn,.thead .fsel{height:24px;display:inline-flex;align-items:center}
.empty-hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);pointer-events:none}
.play{height:4px;margin:4px 0 6px}
.play i.on{background:var(--acc2);border-radius:2px;box-shadow:0 0 8px var(--acc2)}
/* edit modes over the roll: Notes, or bars to drag for Duration / Velocity / Ratchets */
.ovbar{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;margin:0 0 6px}
.ovbar .ovc{display:none;align-items:center;gap:8px;color:var(--ink2);font-size:10.5px}
.ovbar[data-m=dur] .ovc[data-m=dur],.ovbar[data-m=vel] .ovc[data-m=vel],.ovbar[data-m=rep] .ovc[data-m=rep]{display:flex}
.ovbar .ovc .range{width:130px;margin:0 6px}
.ovbar .ovc span{min-width:26px;text-align:center;font-variant-numeric:tabular-nums}
.ovhint{color:var(--ink3);font-size:10.5px}
.adv-off .ovc[data-m=dur],.adv-off .ovc[data-m=vel],.adv-off .ovc[data-m=rep] .range,.adv-off .ovc[data-m=rep] span[id^=lRep]{display:none!important} /* the edit modes are always there; their dice ranges only in Advanced */
.beats #ovseg [data-m=dur],.beats #ovseg [data-m=rep]{display:none}
.roll.ovl .note{opacity:.18!important;pointer-events:none}
.ovlay{position:absolute;top:0;bottom:0;left:var(--kw,44px);right:0;z-index:5;cursor:ns-resize;touch-action:none}
.ovlay .ob{position:absolute;bottom:0;margin-left:2px;border-radius:4px 4px 1px 1px;background:var(--acc2);opacity:.85;pointer-events:none;min-height:3px}
.ovlay .ob b{position:absolute;left:0;right:0;top:-15px;text-align:center;font-size:9.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.ovlay .ob.rep{background:var(--rpt)}
.ovlay .ob.na{background:repeating-linear-gradient(45deg,#ffffff1a 0 4px,transparent 4px 8px);border:1px dashed var(--line2);opacity:1}
.ovlay .ob.na b{color:var(--ink3)}
.ovlay.off{cursor:default}.ovlay.off .ob{opacity:.3}
.ovlay .ob.dv{margin-left:3px;border-radius:2px;bottom:auto}
/* a kit: the note each drum sound sends */
.plug:not(.kitv) .kit{display:none}
.kitv .genrow,.kitv .advR,.kitv .gridw{display:none}
.kit{padding:10px 14px 14px}
.kit .kh{display:flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--ink2)}
.kit .kh b{color:var(--ink);font-size:13px}
.kit table{border-collapse:collapse}
.kit td{padding:3px 10px 3px 0;color:var(--ink2)}
.kit td:first-child{color:var(--ink);font-weight:600;min-width:90px}
.kit input.num{width:56px;padding:3px 6px}
.kit tr.dup td{color:var(--bad)}
.kit tr.foc td:first-child{color:var(--acc)}
.key.drum{cursor:pointer}
.key.drum em{font-style:normal;font-size:8.5px;color:var(--ink3);margin-left:3px}
.steps{height:15px}.steps div{position:relative;color:var(--ink3);font-size:9.5px}
.steps div span{position:absolute;left:0;top:0;transform:translateX(-50%)} /* a label sits on its step line */
.legend{display:flex;gap:14px;align-items:center;color:var(--ink2);font-size:11px;margin-top:4px;flex-wrap:wrap;line-height:1.5}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.playb{width:34px;height:34px;border-radius:50%;border:0;background:var(--acc2);color:#15171c;font-size:14px;display:grid;place-items:center}
.playb.on{background:var(--acc)}
.btn.loopb{margin-left:6px;padding:0 8px}.btn.loopb.on{background:var(--pick);color:var(--acc2);font-weight:700}
.btn.snd{margin-left:6px;font-size:13px;padding:0 7px}.btn.snd.off{opacity:.55}
.sndl{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);margin:6px 0}.sndl span{width:52px}.sndl input{flex:1;accent-color:var(--acc2)}
.grp{display:flex;align-items:center;gap:8px}
.inert{opacity:.45;pointer-events:none}
.mini .knob{width:24px;height:24px}.mini .knob i{width:16px;height:16px}
/* tracks: up to six riffs and one drum track, each with its own form */
.body{display:flex;align-items:stretch}
.tracks{width:186px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;gap:4px}
.tracks>.lbl{padding:0 6px 4px}
.trk{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px 8px 8px 14px;border-radius:9px;border:1px solid transparent;cursor:pointer;color:var(--ink2)}
.trk:before{content:"";position:absolute;left:5px;top:9px;bottom:9px;width:3px;border-radius:2px;background:var(--c);opacity:.5}
.trk:hover{background:#ffffff08}
.trk.cur{background:var(--panel2);border-color:var(--line2);color:var(--ink)}
.trk.cur:before{opacity:1;box-shadow:0 0 8px var(--c)}
.trk.off .nm,.trk.off .tbars{opacity:.4}
.trk .tr1{display:flex;align-items:center;gap:6px}
.trk .nm{font-weight:700;font-size:13px;flex:1;white-space:nowrap}
.trk.cur .nm{color:var(--c)}
.trk .ch{font-size:10px;color:var(--ink3)}
.trk .ib2{width:20px;height:18px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--ink3);font-size:10px;font-weight:700;padding:0;line-height:1}
.trk .ib2:hover{color:var(--ink);border-color:var(--ink3)}
.trk .ib2.mon{background:#e76f5133;border-color:var(--bad);color:var(--bad)}
.trk .tbars{display:flex;gap:3px;align-items:center}
.trk .tbars i{font-style:normal;width:26px;height:15px;border-radius:3px;background:#ffffff0f;color:var(--ink3);font-size:9px;font-weight:700;display:grid;place-items:center}
.trk .tbars i.p{background:var(--c);color:#15171c;box-shadow:0 0 6px var(--c)}
.trk .tbars span{font-size:10px;color:var(--ink3);margin-left:auto}
.tsep{height:1px;background:var(--line);margin:6px 4px}
.addtrk{margin:2px 0 0;padding:7px 10px;border-radius:9px;border:1px dashed var(--line2);background:transparent;color:var(--ink2);text-align:left}
.addtrk:hover:not(:disabled){color:var(--ink);border-color:var(--ink3)}
.addtrk:disabled{opacity:.35;cursor:default}
.ed{flex:1;min-width:0;display:flex;flex-direction:column}
.thead{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);min-height:50px}
.tname{font-weight:800;font-size:17px;color:var(--trk);white-space:nowrap}
.thead .tabset{margin-left:0}
.formrow{display:flex;gap:6px;align-items:stretch;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.formrow .arr{grid-auto-rows:34px}
.ggrp{display:flex;position:relative;padding-left:14px}.ggrp>small{position:absolute;top:-17px;color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap}
.ggrp+.ggrp{border-left:1px solid var(--line);padding-left:14px}
.simkv{padding-left:12px;border-left:1px solid var(--line)}.simkv.dimk{opacity:.4}
.beats #gRhy,.beats #gNotes,.beats #simWrap,.poly #simWrap{display:none}
.genrow{display:flex;align-items:center;gap:14px;padding:24px 14px 10px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:54px}
.genrow .knobs{flex-wrap:nowrap;gap:12px}
.thead .insp{display:flex;align-items:center;gap:6px}
.thead .iname{margin:0;font-size:12px;font-weight:800;color:var(--trk);white-space:nowrap;text-align:right}
.thead .iname:empty{display:none}
.thead .iname small{display:block;font-size:10px;font-weight:400;color:var(--ink3)}
.advrow{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px 22px;align-items:flex-start;padding:8px 14px 6px;border-bottom:1px solid var(--line);background:var(--panel)} /* one strip under the dice row; wraps on narrow screens */
.advrow>div{width:140px;flex:none}
.advrow>.advTog{width:auto}.advrow .advTog .pill{margin-top:5px}
.advrow>.advSeed{width:84px}
@media (max-width:520px){.advrow{gap:8px 14px}.advrow>.advLen{width:calc(50% - 7px)}.advrow>.advSeed{width:70px}} /* phone: two rows */.advrow .advSeed .num{width:100%;margin-top:2px;padding:3px 6px;font-size:11px}
.advrow h5{margin:0 0 2px;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center}
.hidden{display:none}
.narrow .body{flex-direction:column}
.narrow .tracks{width:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}
.narrow .thead,.narrow .genrow{flex-wrap:wrap}
.narrow .song{row-gap:20px}.narrow .genrow{row-gap:26px}
.drop{position:fixed;inset:12px;border:3px dashed var(--acc2);border-radius:14px;background:#0d0e11d9;display:none;place-items:center;z-index:50;color:var(--ink);font-size:18px;text-align:center;line-height:1.6}
.drop small{display:block;color:var(--ink2);font-size:13px}
body.dragging .drop{display:grid}
/* wells: Play and the dice + All sit in shapes of the level below, joined to the panel edge by concave fillets */
.well{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
.well path{fill:var(--panel)}
.song,.genrow{position:relative}
.song>*:not(.well),.genrow>*:not(.well){position:relative;z-index:1}

<body>
<div class="drop" id="drop">Drop the .mid file here<small>up to 4 bars → A A′ B C · monophonic · quantised to 1/16 · into the riff shown</small></div>
<div id="wrap"><div class="plug adv-off" id="plug">
  <!-- level 1: the song bar -->

    <div class="logo">Midi<b>nja</b></div>
    <div class="grp">
      <button class="playb" id="pl" title="Play / Stop: plays the whole form, also with a bar selected (Loop plays only that bar)">▶</button><button class="btn sm loopb" id="loop" title="Loop: with a bar selected, Play repeats only that bar. Off: Play walks the whole form">⟲ Loop</button><button class="btn sm snd" id="snd" title="Sound on / off: the preview synth (⚙ for the volume and effects)">🔊</button>
      <div class="ctl"><small id="playinfo">BPM</small><input class="num" id="bpm" value="122" type="number" min="40" max="240"></div>
    </div>
    <div class="vsep"></div>
    <div class="ctl"><small>Key</small><div style="display:flex;gap:4px"><select class="sel" id="root" title="The root: pick the note here (both tabs move with it), − / + move this tab an octave. The range and the parts follow the root"></select><button class="btn sm" id="ocD" title="This tab an octave down: its root, range and parts">−</button><button class="btn sm" id="ocU" title="This tab an octave up: its root, range and parts">+</button><select class="sel" id="scale" title="The scale: notes keep their degree, colour notes and augmented-second pairs move to the new scale's; locked notes stay; chords take their quality from the scale"></select></div></div>
    <div class="sp"></div>
    <div class="ctl"><small>Versions</small><div class="hist"><button class="pg" id="hPrev" title="Older">◂</button><div class="hist" id="hist"></div><button class="pg" id="hNext" title="Newer">▸</button></div></div>
    <div class="undoredo"><button class="btn ghost" id="undo" title="Undo (Ctrl+Z)">↶</button><button class="btn ghost" id="redo" title="Redo (Ctrl+Shift+Z)">↷</button></div>
    <div class="vsep"></div>
    <button class="btn" id="imp" title="Import a .mid file (or drop one on the page) into the Riff tab: up to 4 bars become A A′ B C">⤒ Import</button>
    <input type="file" id="impFile" accept=".mid,.midi,audio/midi" hidden>
    <button class="btn" id="exp" title="Save the arrangement as one .mid file: a track per tab that is on, each on its channel">⤓ Export</button>
    <div class="tog" id="adv" title="The dice ranges (Length, Duration, Velocity, Ratchets), seed, start on root, and the undo buttons"><div class="sw"></div>Advanced</div>
    <button class="btn" id="help" data-pop title="Legend and keyboard shortcuts">?</button>
    <button class="btn" id="gear" data-pop title="The preview sound (volume, delay, reverb), the DAW the note names follow, and a drum test .mid">⚙</button>
  </div>

  <!-- the tracks on the left; the track shown on the right: header, form, generator, roll -->
  <div class="body">
    <div class="tracks" id="tracks"></div>
    <div class="ed">
      <div class="thead">
        <div class="tname" id="tname"></div>

        <div class="sp"></div>
        <div class="insp"><h4 class="iname" id="inspName"></h4><div class="cinsp" id="cinsp"></div></div>

        </div></div>

        <div class="msg" id="msg"></div>
      </div>
      <div class="kit" id="kit"></div>
    </div>
  </div>

// playback: the audio clock schedules each step a little ahead (so the timing holds when the page is busy);
// the playhead follows the steps as they sound. Sound off still runs the clock, it only skips the notes.
let timer = null, stepIdx = 0, aStep = 0, aNext = 0, aTimer = 0;
const heard = []; // steps scheduled, not yet reached: { g, t }
const cycleLen = () => playSeq().length * S.numSteps;
const stepSec = () => 60 / (+$('bpm').value || 120) / S.rate;
// a riff's sound: its own pick, else Bass for a low riff and Lead above
const voiceOf = t => t.voice || (t.rootNote < 48 ? 'bass' : 'lead');
// a note heard while editing (not during Play)
function hear(t, note, vel, steps = 1) {
  if (!snd.on || timer) return;
  synth.resume();
  if (t.drums) synth.drum(note, vel, synth.time); else synth.note(voiceOf(t), note, vel, synth.time, Math.max(0.25, steps * stepSec()));
}
// the part and the bar track t plays at step g: the track shown follows the bar picked, the others their forms
function partAt(t, g) {
  const n = S.numSteps;
  if (t === T) { const seq = playSeq(), i = Math.floor((g % (seq.length * n)) / n); return { p: t.parts[seq[i]], b: looping() ? S.sel : i }; }
  if (!t.arr.length) return null;
  const b = Math.floor(g / n) % t.arr.length; return { p: t.parts[t.arr[b]], b };
}
function playStepAt(g, at) {
  const s = g % S.numSteps, sec = stepSec();
  [...riffs, drumT].forEach(t => {
    if (!t.on) return;
    const pb = partAt(t, g); if (!pb || !pb.p || s >= pb.p.numSteps) return;
    const p = pb.p;
    if (t.drums) {
      DRUMS.forEach(([x]) => { const h = p.hits[x][s]; if (h.on) synth.drum(x, h.velocity, at); });
      if (s === 0 && autoCrash(pb.b, t)) synth.drum(49, DEF_VEL(1), at);
      return;

    const st = p.steps[s]; if (!st.on) return;
    const len = st.length * sec, reps = Math.max(1, st.repeats);
    if (reps > 1) for (let r = 0; r < reps; r++) synth.note(voiceOf(t), st.note, st.velocity, at + r * len / reps, len / reps * 0.8);
    else synth.note(voiceOf(t), st.note, st.velocity, at, Math.max(0.02, len * durOf(st) / 100));
  });
}
function schedule() {
  const ahead = document.hidden ? 1.5 : 0.12; // a hidden tab wakes the timer only once a second
  while (aNext < synth.time + ahead) {

}
function tick() {
  let moved = false, partMoved = false;
  while (heard.length && heard[0].t <= synth.time) {
    const { g } = heard.shift();
    moved = true;
    playPos = g % cycleLen(); playStep = playPos % S.numSteps; stepIdx = g + 1;
    if (S.sel < 0 && arr.length && playingPart() !== S.cur) { S.cur = playingPart(); refreshPat(); partMoved = true; }
  }

}
function stopPlay() {
  cancelAnimationFrame(timer); clearTimeout(aTimer); timer = null; heard.length = 0; synth.stopAll();
  playStep = -1; $('pl').textContent = '▶'; $('pl').classList.remove('on'); render();
}
$('pl').onclick = () => {
  if (timer) { stopPlay(); return; }

  stepIdx = 0; playPos = 0; aStep = 0; aNext = synth.time + 0.06; heard.length = 0;

// ---- MIDI import / export -------------------------------------------------------------------
function parseMidi(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let pos = 0;
  const str = n => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(u8[pos + i]); pos += n; return s; };
  const u32 = () => { const v = dv.getUint32(pos); pos += 4; return v; };
  const u16 = () => { const v = dv.getUint16(pos); pos += 2; return v; };
  const vlq = () => { let v = 0, b; do { b = u8[pos++]; v = (v << 7) | (b & 0x7f); } while (b & 0x80 && pos < u8.length); return v; };
  if (str(4) !== 'MThd') throw new Error('not a MIDI file');
  const hl = u32(); u16(); const ntr = u16(), div = u16(); pos += hl - 6;
  if (div & 0x8000) throw new Error('SMPTE timing is not supported');
  const ppq = div || 480, notes = [];
  for (let t = 0; t < ntr && pos + 8 <= u8.length; t++) {
    if (str(4) !== 'MTrk') break;
    const len = u32(), end = Math.min(u8.length, pos + len);
    let tick = 0, status = 0;
    const open = {};
    while (pos < end) {
      tick += vlq();
      let st = u8[pos];
      if (st & 0x80) { pos++; if (st < 0xf0) status = st; } else st = status;
      if (st === 0xff) { pos++; const l = vlq(); pos += l; continue; }
      if (st === 0xf0 || st === 0xf7) { const l = vlq(); pos += l; continue; }
      const hi = st & 0xf0;
      if (hi === 0x90 || hi === 0x80) {
        const note = u8[pos++], vel = u8[pos++], key = (st & 0x0f) * 128 + note;
        if (hi === 0x90 && vel > 0) { if (open[key] !== undefined) notes.push({ tick: open[key].tick, dur: Math.max(1, tick - open[key].tick), note, vel: open[key].vel }); open[key] = { tick, vel }; }
        else if (open[key] !== undefined) { notes.push({ tick: open[key].tick, dur: Math.max(1, tick - open[key].tick), note, vel: open[key].vel }); delete open[key]; }
      } else if (hi === 0xc0 || hi === 0xd0) pos += 1;
      else pos += 2;
    }
    for (const k in open) notes.push({ tick: open[k].tick, dur: ppq, note: k % 128, vel: open[k].vel });
    pos = end;
  }
  return { ppq, notes };
}
function importMidi(u8, name) {
  if (timer) stopPlay(); // an import replaces the project
  let m;
  try { m = parseMidi(u8); } catch (e) { say(`Could not read ${name}: ${e.message}`, true); render(); return; }
  const N = 16, MAX = 4 * N, stepTicks = m.ppq / 4;
  const q = m.notes.map(x => { const s = Math.round(x.tick / stepTicks); let e = Math.round((x.tick + x.dur) / stepTicks); if (e <= s) e = s + 1; return { s, e, note: x.note, vel: x.vel, d: x.dur }; })
    .filter(x => x.s >= 0 && x.s < MAX).sort((a, b) => a.s - b.s || a.note - b.note);
  const placed = [];
  let last = null;
  for (const x of q) {
    if (last && x.s === last.s) continue;
    if (last && x.s < last.e) { if (x.note < last.note) last.e = x.s; else continue; }
    x.e = Math.min(x.e, (Math.floor(x.s / N) + 1) * N);
    placed.push(x); last = x;
  }
  if (!placed.length) { say(`No notes found in ${name}`, true); render(); return; }
  const nBars = Math.min(4, Math.floor((Math.max(...placed.map(x => x.e)) - 1) / N) + 1);
  const w = placed.map((x, j) => ({ note: x.note, weight: (x.e - x.s) * (x.s % 4 === 0 ? 2 : 1) + (j === 0 ? 1 : 0) + (j === placed.length - 1 ? 2 : 0) }));
  const k = core.detectKey(w);
  if (T.drums) useTrack(curRiff); else useTab(0);
  const d = ((k.root - S.root + 18) % 12) - 6;
  if (d) riffs.forEach(t => { if (t !== T) shiftTab(t, d); });
  S.root = k.root; S.scale = k.scale; $('scale').value = S.scale;
  const lo = Math.min(...placed.map(x => x.note)), hi = Math.max(...placed.map(x => x.note));
  T.lowNote = lo; T.highNote = Math.min(hi, lo + MAX_SPAN); T.view = null;
  T.rootNote = lo + ((S.root - lo) % 12 + 12) % 12;
  S.rate = 4; S.numSteps = N;
  const fresh = [0, 1, 2, 3].map(newPat);
  placed.forEach(x => { const b = Math.floor(x.s / N); const len = Math.min(MAX_LEN, x.e - x.s); fresh[b].steps[x.s - b * N] = { on: true, note: x.note, length: len, dur: Math.max(5, Math.min(100, Math.round(100 * x.d / (len * stepTicks)))), velocity: Math.max(1, Math.min(127, x.vel)), repeats: 1, locked: false }; });
  T.parts = fresh; T.locks = [false, false, false, false]; T.src = [0, 1, 2, 3].map(b => b < nBars ? 'import' : 'roll');
  useTab(0);
  parts.forEach(p => { fitP(p); rebase(p); });
  arr = T.arr = Array.from({ length: nBars }, (_, b) => b); S.sel = -1;
  chords = []; S.csel = null;
  S.cur = 0; refreshPat();
  S.seed = newSeed();
  const dropped = m.notes.length - placed.length;
  say(`Imported ${nBars} bar${nBars > 1 ? 's' : ''} from ${name} → ${PARTS.slice(0, nBars).join(' ')} · key guess ${NAMES[k.root]} ${SCALES[k.scale].name} (${Math.round(k.confidence * 100)}% sure; change Key to correct it)` + (dropped > 0 ? ` · ${dropped} overlapping or late note${dropped > 1 ? 's' : ''} dropped` : ''));
  commitVersion();
}

// One format-1 .mid: a tempo track, then a track per tab that is on. The Chords track is the lane
// (every voiced note, the range only crops the view).
// One format-1 .mid: a tempo track, then a track per track that is on. Each loops its own form up to
// the common length (the least common multiple of the form lengths, so 3 over 4 gives 12 bars).
// each drum once, kick first (the order of the roll from the bottom), a beat of rest between; text events name them
function exportTestKit() {
  const PPQ = 480, ch = drumT.ch - 1, bytes = [], ev = [];
  const vlq = v => { const out = [v & 0x7f]; while ((v >>= 7) > 0) out.unshift((v & 0x7f) | 0x80); return out; };
  const u32 = v => [(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255];
  const text = s => [...new TextEncoder().encode(s)];
  const name = text('Midinja test kit');
  ev.push({ tick: 0, data: [0xff, 0x03, ...vlq(name.length), ...name] });
  [...DRUMS].reverse().forEach(([x, label], i) => {
    const t = i * 2 * PPQ, o = outNote(x), tx = text(`${label} ${o}`);
    ev.push({ tick: t, data: [0xff, 0x01, ...vlq(tx.length), ...tx] }, { tick: t, data: [0x90 | ch, o, 110] }, { tick: t + PPQ / 2, data: [0x80 | ch, o, 0] });
  });
  const body = []; let last = 0; ev.forEach(e => { body.push(...vlq(e.tick - last), ...e.data); last = e.tick; }); body.push(0, 0xff, 0x2f, 0);
  bytes.push(0x4d, 0x54, 0x68, 0x64, ...u32(6), 0, 0, 0, 1, (PPQ >> 8) & 255, PPQ & 255, 0x4d, 0x54, 0x72, 0x6b, ...u32(body.length), ...body);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([new Uint8Array(bytes)], { type: 'audio/midi' }));
  a.download = 'midinja-test-kit.mid'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  say(`Saved ${a.download} · ${DRUMS.length} drums, one per beat with rests, channel ${drumT.ch}`);
}
function exportMidi() {
  const on = [...riffs, drumT].filter(t => t.on && t.arr.length);
  if (!on.length) { say('Every track is muted: unmute one to export', true); render(); return; }
  const gcd = (a, b) => b ? gcd(b, a % b) : a, bars = on.reduce((m, t) => m * t.arr.length / gcd(m, t.arr.length), 1);
  const PPQ = 480, stepT = PPQ * 4 / S.numSteps, bpm = +$('bpm').value || 120;
  const bytes = [];
  const vlq = v => { const out = [v & 0x7f]; while ((v >>= 7) > 0) out.unshift((v & 0x7f) | 0x80); return out; };
  const u32 = v => [(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255];
  const track = events => { const body = []; let last = 0; events.forEach(e => { body.push(...vlq(e.tick - last), ...e.data); last = e.tick; }); body.push(0, 0xff, 0x2f, 0); return [0x4d, 0x54, 0x72, 0x6b, ...u32(body.length), ...body]; };
  const text = s => [...new TextEncoder().encode(s)];
  const usPerBeat = Math.round(60000000 / bpm);
  const tempo = [{ tick: 0, data: [0xff, 0x51, 3, (usPerBeat >> 16) & 255, (usPerBeat >> 8) & 255, usPerBeat & 255] }, { tick: 0, data: [0xff, 0x58, 4, 4, 2, 24, 8] }];
  bytes.push(0x4d, 0x54, 0x68, 0x64, ...u32(6), 0, 1, 0, on.length + 1, (PPQ >> 8) & 255, PPQ & 255, ...track(tempo));
  on.forEach(tab => {
    const ch = tab.ch - 1, ev = [];
    const name = text(`Midinja ${tab.name}`);
    ev.push({ tick: 0, data: [0xff, 0x03, ...vlq(name.length), ...name] });
    // dur: the percent of the length that sounds, in ticks (shorter than a step is fine; 1/128 at least); ratchets: the hits split the length
    const add = (startStep, lenSteps, notes, vel, reps, dur = 100) => {
      const start = Math.round(startStep * stepT + (startStep % 2 ? S.swing * 0.5 * stepT : 0));
      const tot = Math.round(lenSteps * stepT), each = Math.floor(tot / reps);
      const gate = reps > 1 ? Math.max(1, each - 1) : Math.max(PPQ / 32, Math.min(tot - 1, Math.round(tot * dur / 100)));
      for (let r = 0; r < reps; r++) notes.forEach(note => { const nte = Math.max(0, Math.min(127, note)); ev.push({ tick: start + r * each, pri: 1, data: [0x90 | ch, nte, vel] }); ev.push({ tick: start + r * each + gate, pri: 0, data: [0x80 | ch, nte, 0] }); });
    };
    for (let bar = 0; bar < bars; bar++) {
      const b = bar % tab.arr.length, p = tab.parts[tab.arr[b]], at0 = bar * p.numSteps;
      if (tab.drums) {
        for (let s = 0; s < p.numSteps; s++) DRUMS.forEach(([note]) => { const h = p.hits[note][s]; if (h.on) add(at0 + s, 1, [outNote(note)], h.velocity, 1); });
        if (autoCrash(b, tab)) add(at0, 1, [outNote(49)], DEF_VEL(1), 1);
      } else for (let s = 0; s < p.numSteps; s++) { const st = p.steps[s]; if (st.on) add(at0 + s, st.length, [st.note], st.velocity, Math.max(1, st.repeats), durOf(st)); }
    }
    ev.sort((a, b) => a.tick - b.tick || (a.pri || 0) - (b.pri || 0));
    bytes.push(...track(ev));
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([new Uint8Array(bytes)], { type: 'audio/midi' }));
  a.download = `midinja-${NAMES[S.root].replace('#', 's')}-${SCALES[S.scale].name.replace(/[^A-Za-z0-9]+/g, '')}.mid`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  say(`Saved ${a.download} · ${on.length} track${on.length > 1 ? 's' : ''}, ${bars} bar${bars > 1 ? 's' : ''}`);
  render();
}
$('exp').onclick = exportMidi;

function plugScale() { const w = document.documentElement.clientWidth; return Math.min(1, (w - 24) / 1220); }
function fitW() {
  const w = document.documentElement.clientWidth, narrow = w < 720, k = narrow ? 1 : plugScale();
  plug.classList.toggle('narrow', narrow); plug.style.width = narrow ? (w - 24) + 'px' : '';
  plug.style.transformOrigin = '0 0'; plug.style.transform = k < 1 ? `scale(${k})` : '';
  $('wrap').style.height = (plug.offsetHeight * k) + 'px';
  document.body.style.padding = k < 1 ? '12px' : '20px';
}

// ---- wells: SVG paths (a JUCE Path can copy them) of the level below, around Play and the dice + All
// a tab rising from an edge (up, in its own coordinates), with concave fillets f where it meets the edge
function tabPath(L, R, H, rr, f) {
  rr = Math.min(rr, (R - L) / 2, H);
  return `M${L - f},0A${f},${f} 0 0 0 ${L},${-f}L${L},${-H + rr}A${rr},${rr} 0 0 1 ${L + rr},${-H}L${R - rr},${-H}A${rr},${rr} 0 0 1 ${R},${-H + rr}L${R},${-f}A${f},${f} 0 0 0 ${R + f},0Z`;
}
// the box of el inside host, in the panel's own (unscaled) pixels
function boxIn(el, host) {
  const k = plug.getBoundingClientRect().width / plug.offsetWidth || 1, a = el.getBoundingClientRect(), b = host.getBoundingClientRect();
  return { l: (a.left - b.left) / k, t: (a.top - b.top) / k, r: (a.right - b.left) / k, b: (a.bottom - b.top) / k };
}
// one well in host: from its bottom edge going up, or from its top edge going down; d(y0) gives the path,
// none when the target sits too far from the edge (a wrapped row)
function well(host, up, d) {
  let svg = host.querySelector(':scope > svg.well');
  if (!d) { svg?.remove(); return; }
  if (!svg) { svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('class', 'well'); host.prepend(svg); }
  const y0 = up ? host.clientHeight + 1 : -1;
  svg.innerHTML = `<path transform="translate(0 ${y0}) scale(1 ${up ? 1 : -1})" d="${d(y0)}"/>`;
}
function drawWells() {
  const song = document.querySelector('.song'), sb = boxIn($('pl'), song);
  well(song, true, song.clientHeight - sb.t > 60 ? null : y0 => tabPath(sb.l - 6, sb.r + 6, y0 - sb.t + 6, 14, 9));
  const gen = document.querySelector('.genrow'), dg = document.querySelector('.dicegrp');
  if (!dg.offsetParent) { well(gen, false, null); return; }
  const g = boxIn(dg, gen);
  well(gen, false, g.t > 40 ? null : y0 => tabPath(g.l - 6, g.r + 6, g.b + 6 - y0, 13, 9));
}
addEventListener('resize', () => requestAnimationFrame(drawWells));

{

}
