<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midinja preview</title>
<style>
:root{--bg:#15171c;--panel:#1d2027;--panel2:#242832;--line:#2e3340;--line2:#3d4350;--ink:#e6e8ee;--ink2:#9aa1b2;--ink3:#626a7c;--acc:#ff9f43;--acc2:#5ad1c7;--lock:#f5d76e;--len:#7aa2f7;--rpt:#c792ea;--bad:#e76f51;--prim:#ff9f43;--primbg:#ff9f4322;--ctx:#8a5a2c;--state:#4a5163;--pick:#5ad1c71f}
*{box-sizing:border-box}html,body{margin:0;background:#0d0e11;overflow-x:hidden}
body{font:12px/1.25 "Segoe UI",Inter,system-ui,sans-serif;color:var(--ink);padding:20px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.plug{width:1216px;background:var(--bg);border-radius:12px;border:1px solid #000;box-shadow:0 20px 60px #000a;overflow:hidden;user-select:none}
.row{display:flex;align-items:center;gap:12px;padding:9px 14px}
.song{gap:8px;background:linear-gradient(#22262f,#1b1e25);border-bottom:1px solid #000;padding:7px 14px}
.song .hist{gap:3px}
.song .btn{padding:6px 9px}
.logo{font-weight:800;font-size:18px;letter-spacing:.5px}.logo b{color:var(--acc)}
.sp{flex:1}.vsep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
.btn{padding:7px 10px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.btn:hover{border-color:#4a5163}
.btn.on{background:var(--pick);border-color:var(--acc2);color:var(--acc2)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.35;cursor:default}
.sm{padding:3px 8px}
.xs{padding:2px 7px;font-size:11px}
.dim{color:var(--ink3)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 11px;color:var(--ink2)}
.seg button.on{background:var(--pick);color:var(--acc2);font-weight:700}
.seg.small button{padding:5px 9px}
.seg.xs button{padding:3px 8px;font-size:11px}
.seg button:disabled{opacity:.35;cursor:default}
.gen{display:flex;align-items:center;gap:6px}
.dice{width:38px;height:38px;border-radius:9px;border:0;background:var(--acc);color:#1a1206;font-size:31px;line-height:1;box-shadow:0 0 0 3px #ff9f4333;display:grid;place-items:center}
.dice:active{transform:translateY(1px)}
.dice[disabled]{opacity:.35;cursor:default;box-shadow:none}
.mutamt{display:inline-block;margin-left:5px;padding:0 5px;border-radius:999px;background:#ffffff14;color:var(--ink2);font-size:10px}
.seg button.on .mutamt{background:#5ad1c733;color:var(--acc2)}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl small,.lbl{color:var(--ink3);font-size:10px;text-transform:uppercase;letter-spacing:.8px}
.sel{padding:6px 9px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap;appearance:none;-webkit-appearance:none;cursor:pointer;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,#626a7c 50%),linear-gradient(135deg,#626a7c 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.sel option{background:#242832}
.sel.xs{padding:3px 20px 3px 7px;font-size:11px;background-position:calc(100% - 10px) 50%,calc(100% - 6px) 50%}
.knob{width:32px;height:32px;border-radius:50%;background:conic-gradient(var(--acc) 0 var(--v),#333845 var(--v) 75%,transparent 75%);transform:rotate(-135deg);display:grid;place-items:center;flex:none;cursor:ns-resize}
.knob.t{background:conic-gradient(var(--acc2) 0 var(--v),#333845 var(--v) 75%,transparent 75%)}
.knob i{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:block}
.kv{display:flex;align-items:center;gap:6px}.kv span{color:var(--ink2);font-size:11px}.kv b{font-weight:600}
.mus{display:flex;gap:12px;align-items:center;padding-left:12px;border-left:1px solid var(--line)}
.hist{display:flex;align-items:center;gap:4px}
.th{width:40px;height:26px;border-radius:5px;background:var(--panel);border:1px solid var(--line);position:relative;overflow:hidden;cursor:pointer}
.th.cur{border-color:var(--ink2)}
.th.empty{opacity:.25;cursor:default}
.th i{position:absolute;width:2px;height:2px;background:var(--ink3)}
.th.cur i{background:var(--ink)}
.th .star{position:absolute;right:1px;top:-2px;font-size:9px;color:var(--lock)}
.pg{padding:3px 5px;border:0;background:transparent;color:var(--ink2)}
.pg[disabled]{opacity:.25;cursor:default}
.tog{display:flex;align-items:center;gap:7px;color:var(--ink2);cursor:pointer}
.sw{width:30px;height:16px;border-radius:999px;background:#333845;position:relative;transition:.15s}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#9aa1b2;transition:.15s}
.tog.on .sw{background:#5ad1c755}.tog.on .sw:after{left:16px;background:var(--acc2)}
.tog.on{color:var(--acc2)}
.num{padding:5px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
input.num{width:64px}
.tabbar{display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--bg);border-bottom:1px solid var(--line);min-height:40px}
.tb{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);cursor:pointer;font-weight:700;font-size:13px}
.tb:hover{border-color:#4a5163}
.tb.cur{color:var(--ink);border-color:var(--line2);box-shadow:inset 0 -2px 0 var(--ink)}
.tb .dot{width:11px;height:11px;border-radius:50%;border:2px solid var(--ink3);background:transparent;flex:none}
.tb .dot.on{background:var(--acc2);border-color:var(--acc2);box-shadow:0 0 6px var(--acc2)}
.tb.off .dot{border-color:var(--ink3)}
.tabset{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:11px}
.tabset .lbl{margin:0 2px 0 8px}
.tabset .lbl:first-child{margin-left:0}
.main{display:flex;align-items:stretch}
.undoredo{display:flex}
.adv-off .advbox,.adv-off .lanes,.adv-off .undoredo{display:none}
.rside{width:318px;flex:none;padding:10px 12px 12px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:10px}
.ctxhead{display:flex;align-items:center;justify-content:space-between}
.box{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 10px;display:flex;flex-direction:column;gap:8px}
.box h4{margin:0;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px}
.box h4.iname{font-size:13px;font-weight:800;color:var(--prim);text-transform:none;letter-spacing:0;line-height:1.2}
.box h4.iname small{display:block;font-size:10px;font-weight:400;color:var(--ink3);margin-top:2px}
.box h5{margin:0 0 2px;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;display:flex;justify-content:space-between;align-items:center}
.advR{display:flex;flex-direction:column;gap:10px}
.advC{display:flex;flex-direction:column;gap:6px}
.advC input{padding:4px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:11px;width:100%}
.poly #riffGen,.poly .advR,.poly .hstrip{display:none}
.plug:not(.poly) .cgen,.plug:not(.poly) .advC,.plug:not(.poly) .clane{display:none}
.knobs{flex-wrap:wrap;gap:8px 10px}
.knobs .kv{gap:5px}.knobs .kv span{font-size:10px}
.form{padding:8px 14px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.ruler{display:flex;gap:6px;align-items:stretch;margin-bottom:6px}
.ruler .addcol{width:30px;flex:none}
.hstrip{display:grid;gap:6px;margin-right:36px}
.hbar{min-height:24px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);display:flex;gap:3px;padding:2px;cursor:pointer}
.hbar:hover{border-color:#4a5163}
.hbar .hc{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:4px;background:#2b303a;font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;padding:0 4px}
.hbar .hc b{color:var(--ink);font-weight:800}
.hbar .hc.ctx{box-shadow:0 0 0 1px var(--ctx) inset}
.hbar .none{flex:1;text-align:center;color:var(--ink3);font-size:11px;align-self:center}
.pop{position:fixed;display:none;z-index:60;min-width:160px;max-width:420px;padding:8px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);box-shadow:0 10px 30px #000a;color:var(--ink);font-size:12px}
.pop .pi{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--ink2)}
.pop .pi:hover{background:#ffffff10;color:var(--ink)}
.pop .pi.on{color:var(--ink);box-shadow:0 0 0 1px var(--ctx) inset}
.pop .pi b{min-width:22px;color:var(--ink);font-size:13px}
.pop .legend{margin:0;max-width:400px;gap:8px 12px}
.pop h4{margin:0 0 6px;font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px}
.pop .grp{padding:4px 0}
.narrow .song,.narrow .tabbar{flex-wrap:wrap}
.narrow .main{flex-direction:column}
.narrow .rside{width:auto;border-left:0;border-top:1px solid var(--line)}
.narrow .sp{display:none}
.range{position:relative;height:6px;border-radius:3px;background:#333845;margin:9px 6px 5px}
.range b{position:absolute;top:0;bottom:0;background:var(--acc2);border-radius:3px}
.range u{position:absolute;top:-4px;width:12px;height:14px;margin-left:-6px;border-radius:4px;background:#e6e8ee;cursor:ew-resize}
.rl{display:flex;justify-content:space-between;color:var(--ink2);font-size:10.5px}
.offbox .range,.offbox .rl{opacity:.35;pointer-events:none}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;border:1px solid var(--line);background:#2a2e38;color:var(--ink3);font-size:9.5px;letter-spacing:.6px;cursor:pointer}
.pill.on{color:var(--acc2);border-color:var(--acc2)}
.gridw{flex:1;padding:8px 12px 10px;min-width:0}
.cols{display:grid;grid-template-columns:44px repeat(var(--n),1fr)}
.arr{flex:1;display:grid;gap:6px;min-width:0}
.slot{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);cursor:pointer;position:relative;min-width:0}
.arrhint{color:var(--ink3);font-size:11px;padding:6px 2px}
.slot .bn{font-size:10px;color:var(--ink3);min-width:10px}
.slot .tn i{font-style:normal;font-size:9px;color:var(--ink3);margin-left:2px}
.slot .tn:hover i{color:var(--ink)}
.slot .tt{flex:1;width:auto}
.slot .x{margin-left:auto}
.slot.prim .bn{color:var(--prim)}
.slot:hover{border-color:#4a5163}
.slot.ctx{border-color:var(--ctx);color:var(--ink)}
.slot.prim{background:var(--primbg);border-color:var(--prim);color:var(--prim);box-shadow:0 0 0 1px var(--prim) inset}
.slot.locked{border-color:var(--state)}
.slot.locked.prim{border-color:var(--prim)}
.slot.locked.ctx{border-color:var(--ctx)}
.tn{font-weight:700;font-size:13px;min-width:16px;text-align:center;line-height:1.1;padding:2px 4px;border-radius:5px}
.tn:hover{background:#ffffff14}
.tn small{display:block;font-size:9px;font-weight:400;color:var(--ink3);line-height:1.1}
.slot.prim .tn small{color:var(--prim)}
.slot .lk{font-size:11px;opacity:.3;padding:2px 3px;border-radius:4px;line-height:1}
.slot .lk:hover{opacity:.9;background:#ffffff14}
.slot.locked .lk{opacity:1}
.slot .x{border:0;background:transparent;color:var(--ink3);font-size:14px;line-height:1;padding:2px 5px;border-radius:4px}
.slot .x:hover{color:var(--ink);background:#ffffff14}
.slot .pp{position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--acc2);display:none;box-shadow:0 0 6px var(--acc2)}
.slot.playing .pp{display:block}
.slot.prim .tt i{background:var(--prim)}
.aadd{width:30px;height:30px;padding:0;display:grid;place-items:center;color:var(--acc);border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:18px;line-height:1}
.aadd:disabled{opacity:.35;cursor:default}
.tt{width:44px;height:16px;border-radius:4px;background:#00000040;position:relative;overflow:hidden}
.tt i{position:absolute;width:2px;height:2px;background:var(--ink2)}
.msg{color:var(--acc2);font-size:11px;margin:6px 0 0;min-height:14px}
.msg.err{color:var(--bad)}
.msg:empty{display:none}
/* the chord lane: a square + on the left, then blocks on a beat grid */
.clane{display:flex;gap:6px;margin:0}
.clane .lanebox{flex:1}
.addcol{display:flex;align-items:center;justify-content:center;width:30px;flex:none}
.addcol button{width:30px;height:30px;padding:0;display:grid;place-items:center;color:var(--acc);border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-size:18px;line-height:1}
.addcol button:disabled{opacity:.35;cursor:default}
.lanebox{position:relative;height:72px;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden;touch-action:none}
.tick{position:absolute;top:0;bottom:0;width:1px;background:#ffffff0a}
.tick.bl{background:var(--line2);width:2px}
.tick.ph{background:var(--acc2);width:2px;opacity:.6}
.chord{position:absolute;top:4px;bottom:4px;background:#2b303a;border:1px solid #4a5263;border-radius:7px;display:flex;flex-direction:column;justify-content:space-between;padding:2px 5px;user-select:none;cursor:grab;overflow:hidden}
.chord.locked{border-color:var(--state);background:#2b303a}
.chord.sel{border-color:var(--prim);box-shadow:0 0 0 1px var(--prim) inset;background:#3a3127}
.chord.dragging{cursor:grabbing;opacity:.9}
.chord .crow{display:flex;justify-content:space-between;align-items:center;gap:3px;min-height:16px}
.chord .mid{text-align:center;line-height:1.05;pointer-events:none}
.chord .numr{font-weight:800;font-size:15px;color:var(--ink)}
.chord.sel .numr{color:var(--prim)}
.chord .cname{font-size:10.5px;color:var(--ink2);white-space:nowrap}
.chord .ib{height:16px;min-width:16px;padding:0 3px;font-size:10px;border-radius:4px;background:transparent;border:1px solid transparent;color:var(--ink2);line-height:14px}
.chord .ib:hover{border-color:var(--line2);color:var(--ink)}
.chord .ib.on{opacity:1}
.chord .ib[data-act="lock"]{opacity:.45}
.chord .rh{font-size:9.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.cedge{position:absolute;top:0;bottom:0;width:13px;cursor:ew-resize;z-index:2}
.cedge.l{left:-2px}.cedge.r{right:-2px}
.cedge::after{content:"";position:absolute;top:30%;bottom:30%;left:5px;width:4px;border-radius:2px;background:var(--line2)}
.cedge.r::after{left:auto;right:5px}
.chord.sel .cedge::after{background:var(--ctx)}
.empty-lane{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);pointer-events:none;font-size:11px}
.cgen{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cgen .lbl{margin-left:6px}
.cgen input{flex:1;min-width:150px;padding:3px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:11px}
.cinsp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--ink2);font-size:11px}
.cinsp .big{font-size:15px;font-weight:800;color:var(--prim);min-width:70px}
.cinsp .big small{display:block;font-size:10px;color:var(--ink3);font-weight:400}
.cinsp .lbl{margin-left:4px}
.gstrip{position:relative;height:0;overflow:visible}
.gstrip.has{height:20px;margin:1px 0}
.gnote{position:absolute;top:2px;height:16px;border:1px dashed #8a5a2c;border-radius:3px;background:#ff9f4312;font-size:10px;color:var(--ink2);padding:0 4px;line-height:14px;overflow:hidden;white-space:nowrap}
.gnote.sel{border-color:var(--prim);color:var(--ink)}
.roll{border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative;touch-action:pan-x pan-y pinch-zoom}
.key{overflow:hidden;font-size:9.5px;color:var(--ink3);display:flex;align-items:center;justify-content:flex-end;gap:4px;padding-right:5px;border-bottom:1px solid #00000040;background:var(--panel)}
.poly .key{font-size:12px}
.key.root{color:var(--acc);font-weight:700}
.key.out{color:#454b58}
.key em{font-style:normal;font-size:8.5px;padding:0 3px;border-radius:3px}
.key em.ct{color:var(--ink2);background:#ffffff0d}
.key em.col{color:#15171c;background:var(--acc2);font-weight:700}
.cell{border-left:1px solid #ffffff08;border-bottom:1px solid #00000040;position:relative;cursor:pointer}
.poly .cell{cursor:default}
.cell.beat{border-left-color:#ffffff1c}
.cell.alt{background:#ffffff05}.cell.rootrow{background:#ff9f430d}.cell.outrow{background:#00000040}
.cell.ph{background:#5ad1c714}
.note{position:absolute;top:2px;bottom:2px;left:2px;border-radius:4px;background:var(--acc);box-shadow:inset 0 -2px 0 #0003;z-index:2;cursor:grab}
.note.colr{background:var(--acc2)}
.note.outn{background:#8a90a0}
.note.chord{cursor:default;background:#8a5a2c}
.note.chord.sel{background:var(--acc)}
.note.chord.croot{box-shadow:inset 3px 0 0 #fff8}
.note.ghost{z-index:1;background:#9aa1b2;opacity:.22;pointer-events:none;box-shadow:none;cursor:default}
.note.locked{outline:2px solid var(--lock);outline-offset:-1px}
.note .rat{position:absolute;inset:0;display:flex;gap:2px;padding:2px}
.note .rat i{flex:1;background:#00000033;border-radius:2px}
.lockic{position:absolute;right:3px;top:50%;transform:translateY(-50%);font-size:8px}
.rootmk{position:absolute;left:2px;top:50%;transform:translateY(-50%);font-size:9px;line-height:1;font-weight:800;color:#15171c;background:#fff;border-radius:3px;padding:1px 3px;z-index:3;pointer-events:none}
.arcs{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible}
.arcs path{fill:none;stroke:var(--acc2);stroke-width:1.5px;opacity:.9}
.edge{display:flex;align-items:center;gap:3px;height:18px;margin:2px 0}
.edge .en{width:44px;text-align:right;padding-right:5px;font-size:9.5px;color:var(--ink3);flex:none}
.edge .en.r{width:auto;flex:1;text-align:right;padding-right:4px}
.eb{width:20px;height:16px;line-height:1;padding:0;font-size:11px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);cursor:pointer}
.eb:hover:not(:disabled){border-color:#4a5163}
.eb:disabled{opacity:.3;cursor:default}
.empty-hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);pointer-events:none}
.play{height:4px;margin:4px 0 6px}
.play i.on{background:var(--acc2);border-radius:2px;box-shadow:0 0 8px var(--acc2)}
.lanes{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.lane{position:relative;align-items:end;height:40px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 0;cursor:ns-resize}
.lane .ll{font-size:9.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;align-self:center;justify-self:center}
.bar{margin:0 3px;border-radius:3px 3px 1px 1px;background:var(--acc2);opacity:.85;pointer-events:none}
.bar.off{background:#333845;opacity:1}
.dens{margin:0 3px;display:flex;flex-direction:column-reverse;gap:2px;height:100%;pointer-events:none}
.dens i{height:6px;border-radius:1px;background:#333845}.dens i.on{background:var(--rpt)}
.lane.offlane{height:24px;align-items:center;cursor:default}
.laneoff{grid-column:2/-1;align-self:center;color:var(--ink3);font-size:11px;padding-left:6px}
.steps div{text-align:center;color:var(--ink3);font-size:9.5px}
.legend{display:flex;gap:14px;align-items:center;color:var(--ink2);font-size:11px;margin-top:4px;flex-wrap:wrap;line-height:1.5}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.playb{width:34px;height:34px;border-radius:50%;border:0;background:var(--acc2);color:#15171c;font-size:14px;display:grid;place-items:center}
.playb.on{background:var(--acc)}
.grp{display:flex;align-items:center;gap:8px}
.inert{opacity:.45;pointer-events:none}
.mini .knob{width:24px;height:24px}.mini .knob i{width:16px;height:16px}
.drop{position:fixed;inset:12px;border:3px dashed var(--acc2);border-radius:14px;background:#0d0e11d9;display:none;place-items:center;z-index:50;color:var(--ink);font-size:18px;text-align:center;line-height:1.6}
.drop small{display:block;color:var(--ink2);font-size:13px}
body.dragging .drop{display:grid}
</style></head>
<body>
<div class="drop" id="drop">Drop the .mid file here<small>up to 4 bars → A A′ B C · monophonic · quantised to 1/16 · into the Riff tab</small></div>
<div id="wrap"><div class="plug adv-off" id="plug">
  <!-- level 1: the song bar -->
  <div class="row song">
    <div class="logo">Midi<b>nja</b></div>
    <div class="grp">
      <button class="playb" id="pl" title="Play / Stop: loops the arrangement, or only the selected bar (no sound in the preview)">▶</button>
      <div class="ctl"><small id="playinfo">BPM</small><input class="num" id="bpm" value="122" type="number" min="40" max="240"></div>
    </div>
    <div class="vsep"></div>
    <div class="ctl"><small>Key</small><div style="display:flex;gap:4px"><select class="sel" id="root" title="The root: pick the note here (both tabs move with it), − / + move this tab an octave. The range and the parts follow the root"></select><button class="btn sm" id="ocD" title="This tab an octave down: its root, range and parts">−</button><button class="btn sm" id="ocU" title="This tab an octave up: its root, range and parts">+</button><select class="sel" id="scale" title="The scale: notes keep their degree, colour notes and augmented-second pairs move to the new scale's; locked notes stay; chords take their quality from the scale"></select></div></div>
    <div class="ctl"><small>Rate · steps/bar</small><select class="sel" id="rate" title="One part is one bar of 4/4; the rate sets how many steps it has"><option value="2">1/8 · 8</option><option value="4" selected>1/16 · 16</option><option value="6">1/16T · 12</option></select></div>
    <div class="sp"></div>
    <div class="ctl"><small>Preset</small><div style="display:flex;gap:3px" class="inert" title="Presets come later"><button class="btn ghost sm">◂</button><div class="btn sm" style="min-width:56px;text-align:center">Init</div><button class="btn ghost sm">▸</button></div></div>
    <div class="ctl"><small>Versions</small><div class="hist"><button class="pg" id="hPrev" title="Older">◂</button><div class="hist" id="hist"></div><button class="pg" id="hNext" title="Newer">▸</button></div></div>
    <div class="undoredo"><button class="btn ghost" id="undo" title="Undo (Ctrl+Z)">↶</button><button class="btn ghost" id="redo" title="Redo (Ctrl+Shift+Z)">↷</button></div>
    <div class="vsep"></div>
    <button class="btn" id="imp" title="Import a .mid file (or drop one on the page) into the Riff tab: up to 4 bars become A A′ B C">⤒ Import</button>
    <input type="file" id="impFile" accept=".mid,.midi,audio/midi" hidden>
    <button class="btn" id="exp" title="Save the arrangement as one .mid file: a track per tab that is on, each on its channel">⤓ Export</button>
    <button class="btn" id="gear" data-pop title="Set once: the preview synth and the MIDI out port">⚙</button>
  </div>

  <!-- level 2: the form, the bars with their parts and the harmony under them -->
  <div class="form">
    <div class="ruler"><div class="arr" id="arr"></div><div class="addcol" id="radd"></div></div>
    <div class="hstrip" id="hstrip"></div>
    <div class="clane"><div class="lanebox" id="lane"></div><div class="addcol"><button id="cadd" title="Repeat the last chord after it">+</button></div></div>
  </div>

  <!-- level 3: the track tabs -->
  <div class="tabbar" id="tabbar" title="The two tabs share the key, the form and the harmony; each has its own octave, range and channel (the Riff tab its parts). Export = one .mid, a track per tab that is on"></div>

  <!-- level 4: the roll and, on the right, the generator, the inspector and Advanced -->
  <div class="main">
    <div class="gridw">
      <div class="edge" id="edgeTop"></div>
      <div class="gstrip" id="gtop"></div>
      <div class="roll cols" id="grid"></div>
      <div class="gstrip" id="gbot"></div>
      <div class="edge" id="edgeBot"></div>
      <div class="cols play" id="play"></div>
      <div class="lanes" id="lanes"></div>
      <div class="cols steps" id="stepn"></div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="rside">
      <div class="ctxhead"><div class="tog" id="adv" title="Riff: length, velocity, ratchets, seed, start on root and the lanes under the roll. Chords: a typed progression and the rhythm for all. Also the undo buttons"><div class="sw"></div>Advanced</div><button class="btn sm" id="help" data-pop title="Legend and keyboard shortcuts">?</button></div>
      <div class="box">
        <h4>Generator</h4>
        <div id="riffGen">
          <div class="gen">
            <button class="dice" id="roll" title="Roll the part shown (Space)">⚄</button>
            <div class="seg small" id="what" title="What the dice change: Rhythm, Notes, both (a new riff), or Mutate">
              <button data-w="rhythm" title="New rhythm (keeps the pitches unless Notes is on too)">♩ Rhythm</button>
              <button data-w="notes" title="New pitches (keeps the rhythm unless Rhythm is on too)">♪ Notes</button>
            </div>
            <div class="seg small" id="mutseg"><button data-w="mutate" title="Mutate: change some notes, keep the riff. Click again for 15 / 33 / 50 %">~ Mutate<span class="mutamt" id="mutAmt">15%</span></button></div>
          </div>
          <div class="gen knobs">
            <div class="kv" title="How many steps get a note (next roll). Ctrl+click resets"><div class="knob" id="kDensity"><i></i></div><div><span>Density</span><br><b id="vDensity"></b></div></div>
            <div class="kv"><div class="knob" id="kSwing"><i></i></div><div><span>Swing</span><br><b id="vSwing"></b></div></div>
            <div class="kv" title="How close A′ stays to A (next roll of A′): high changes only the last beat, low keeps just the shape. Ctrl+click resets"><div class="knob" id="kSimilarity"><i></i></div><div><span>Similarity</span><br><b id="vSimilarity"></b></div></div>
            <div class="kv" id="colorWrap"><div class="knob t" id="kColor"><i></i></div><div><span>Color</span><br><b id="vColor"></b></div></div>
            <div class="kv" title="How often the riff breaks the rules (next roll)"><div class="knob t" id="kSurprise"><i></i></div><div><span>Surprise</span><br><b id="vSurprise"></b></div></div>
            <button class="btn sm" id="rollAll" title="The same for all four parts: A, then A′ B C from it (Shift+Space). Locked parts stay">🎲 All</button>
          </div>
        </div>
        <div class="cgen" id="cgen"></div>
      </div>
      <div class="box insp">
        <h4 class="iname" id="inspName"></h4>
        <div class="cinsp" id="cinsp"></div>
      </div>
      <div class="box advbox">
        <h4>Advanced</h4>
        <div class="advR">
          <div><h5>Length</h5><div class="range" id="rgLen"></div><div class="rl"><span id="lLenLo"></span><span id="lLenHi"></span></div></div>
          <div><h5>Velocity</h5><div class="range" id="rgVel"></div><div class="rl"><span id="lVelLo"></span><span id="lVelHi"></span></div></div>
          <div id="rptbox"><h5>Ratchets <span class="pill" id="rptpill">OFF</span></h5><div class="range" id="rgRep"></div><div class="rl"><span id="lRepLo"></span><span id="lRepHi"></span></div></div>
          <div><h5>Start on chord root <span class="pill on" id="rootpill" title="Every bar begins with the root of the chord it starts in. Imported bars are left as they are">ON</span></h5></div>
          <div><h5>Seed</h5><input class="num" id="seed" style="width:100%" title="The seed of the last roll. Type one and press Enter to roll the whole form from it"></div>
        </div>
        <div class="advC" id="advC"></div>
      </div>
    </div>
  </div>
</div></div>
<div class="pop" id="pop"></div>
<template id="legendT"><div class="legend"><span><i style="background:var(--acc)"></i>note</span><span class="mo"><i style="background:var(--acc2)"></i>colour note of the scale</span><span><i style="outline:2px solid var(--lock);outline-offset:-2px"></i>locked note</span><span><i style="background:#9aa1b2;opacity:.3"></i>the other tab (ghost)</span><span><i style="background:transparent;border-top:2px solid var(--acc2);border-radius:50% 50% 0 0;height:5px"></i>augmented-second pair</span><span>click = add / remove · drag = pitch (Alt = chromatic, locks the note) · Shift+click = lock · right-click = longer · chord lane: drag a chord to move it, drag its edge for the length, snap one beat, double-click empty lane to add, Del removes, 🔒 keeps it when you roll · keys 1–4 = part · Space = dice, Shift+Space = All</span></div></template>
<script src="midinja-core.js"></script>

<script>
(async () => {
const core = await MidinjaCore();
const SCALES = core.scales();
const NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const PARTS = ['A', 'A′', 'B', 'C'];
const PART_HINT = ['the motif', 'variation of A', 'contrast', 'leads home'];
const DEG = { 0: '1', 1: '♭2', 2: '2', 3: '♭3', 4: '3', 5: '4', 6: '♯4', 7: '5', 8: '♭6', 9: '6', 10: '♭7', 11: '7' };
const nn = n => NAMES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
const $ = id => document.getElementById(id);
const plug = $('plug');
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---- state -------------------------------------------------------------------------------
// Shared by both tabs: the key (root pitch class, scale), the rate, the arrangement (A A′ B C, the
// melody form) and the chord lane (blocks with a start and a length in beats). Per tab: channel,
// on/off, the root's octave with the range; the Riff tab has four parts with their locks; the
// Chords tab plays the lane.
const S = {
  mode: 1, root: 4, scale: 2, numSteps: 16, rate: 4, notes: 10, swing: 0.18,
  lenMin: 1, lenMax: 2, velMin: 70, velMax: 120,
  repeatsOn: false, repMin: 2, repMax: 3, repChance: 0.25, color: 0.4, surprise: 0.15, similarity: 0.65,
  seed: 4821, adv: false, doRhythm: true, doNotes: true, mutate: false, mutAmt: 0.15, startOnRoot: true,
  cur: 0, sel: -1, tab: 0, csel: null,
};
const MAX_BARS = 4, MAX_SPAN = 36; // three octaves: more rows get too thin to click
const newPat = () => ({ numSteps: S.numSteps, steps: Array.from({ length: 32 }, () => ({ on: false, note: 60, length: 1, velocity: 100, repeats: 1, locked: false })) });
const newTab = (name, ch, poly, on, rootNote, span) => ({ name, ch, poly, on, rootNote, lowNote: rootNote, highNote: rootNote + span, parts: [0, 1, 2, 3].map(newPat), locks: [false, false, false, false], src: ['roll', 'roll', 'roll', 'roll'] });
let tabs = [newTab('Riff', 1, false, true, 40, 24), newTab('Chords', 2, true, false, 52, 19)];
let arr = [0]; // the arrangement: part indices, up to MAX_BARS bars; S.sel is the selected bar or -1
// the chord lane: blocks { id, start, len (beats), deg, type, inv, lock, rhythm }; a gap = no chord
let chords = [], nextId = 1;
const mkChord = (start, len, deg, extra = {}) => ({ id: nextId++, start, len, deg, type: '7th', inv: 0, lock: false, rhythm: 'whole', ...extra });
const TYPES = ['Triad', '7th', '9th', 'sus2', 'sus4', 'add9'];
// chord rhythms, in sixteenths from the chord start for a chord L beats long: [start, length]
const RHYTHMS = {
  whole: { label: 'Whole', f: L => [[0, L * 4]] },
  halves: { label: 'Halves', f: L => { const o = []; for (let b = 0; b < L; b += 2) o.push([b * 4, 8]); return o; } },
  quarters: { label: 'Quarters', f: L => { const o = []; for (let b = 0; b < L; b++) o.push([b * 4, 3]); return o; } },
  stabs: { label: 'Stabs', f: L => { const o = []; for (let s = 0; s < L * 4; s += 16) [[0, 2], [6, 2], [10, 2]].forEach(([a, l]) => o.push([s + a, l])); return o; } },
  push: { label: 'Push', f: L => L * 4 > 2 ? [[0, L * 4 - 2], [L * 4 - 2, 2]] : [[0, L * 4]] },
  offbeat: { label: 'Offbeat', f: L => { const o = []; for (let b = 0; b < L; b++) o.push([b * 4 + 2, 2]); return o; } },
  charleston: { label: 'Charleston', f: L => { const o = []; for (let s = 0; s < L * 4; s += 16) [[0, 2], [6, 2], [8, 2], [14, 2]].forEach(([a, l]) => o.push([s + a, l])); return o; } },
  funk: { label: 'Funk 16ths', f: L => { const o = []; for (let s = 0; s < L * 4; s += 16) [[0, 1], [3, 1], [6, 2], [10, 1], [12, 1], [14, 1]].forEach(([a, l]) => o.push([s + a, l])); return o; } },
};
const RHYTHM_NAMES = Object.keys(RHYTHMS);
let T, parts, locks, src, pat; // the tab shown and the Riff tab's arrays; pat is the pattern shown
function useTab(i) { S.tab = i; T = tabs[i]; parts = tabs[0].parts; locks = tabs[0].locks; src = tabs[0].src; refreshPat(); }
['rootNote', 'lowNote', 'highNote'].forEach(k => Object.defineProperty(S, k, { get: () => T[k], set: v => { T[k] = v; }, enumerable: true }));
let versions = [], vi = -1, histEnd = 0;
let undoStack = [], ui = -1;
const PER_PAGE = 3, MAX_HIST = 60;

const settings = () => ({ ...S });
const clone = x => JSON.parse(JSON.stringify(x));
const newSeed = () => (Math.random() * 0xffffffff) >>> 0 || 1;
const lockMask = () => locks.reduce((m, l, k) => m | (l ? 1 << k : 0), 0);
const hasNotes = p => p.steps.slice(0, p.numSteps).some(s => s.on);
const lastOnIdx = p => { for (let i = p.numSteps - 1; i >= 0; i--) if (p.steps[i].on) return i; return -1; };
function setPart(k, p) { parts[k] = p; refreshPat(); }
const shownBar = () => S.sel >= 0 && S.sel < arr.length ? S.sel : T && T.poly && selChord() ? Math.min(arr.length - 1, chordBar(selChord())) : arr.indexOf(S.cur); // Chords: the bar of the selected chord
function refreshPat() { pat = T.poly ? chordPat(shownBar()) : parts[S.cur]; }
function selectPart(k) { S.cur = k; refreshPat(); render(); }
function selectSlot(i) { S.sel = S.sel === i ? -1 : i; if (S.sel >= 0) S.cur = arr[i]; stepIdx = 0; playPos = 0; refreshPat(); render(); }

// ---- scale and chord maths ---------------------------------------------------------------
const pcOf = n => ((n - S.root) % 12 + 12) % 12;
const inScale = n => SCALES[S.scale].intervals.includes(pcOf(n));
const nScale = () => SCALES[S.scale].intervals.length;
const iv = () => SCALES[S.scale].intervals;
const at = k => { const n = iv().length; return iv()[((k % n) + n) % n] + 12 * Math.floor(k / n); };
const rel = (d, k) => at(k) - at(d);
function qual(d) { const t = rel(d, d + 2), f = rel(d, d + 4); return t === 4 && f === 7 ? 'maj' : t === 3 && f === 7 ? 'min' : t === 3 && f === 6 ? 'dim' : t === 4 && f === 8 ? 'aug' : 'maj'; }
const MAJ = [0, 2, 4, 5, 7, 9, 11], ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];
const degsOf = c => { const d = c.deg; return c.type === 'Triad' ? [d, d + 2, d + 4] : c.type === '7th' ? [d, d + 2, d + 4, d + 6] : c.type === '9th' ? [d, d + 2, d + 4, d + 6, d + 8] : c.type === 'sus2' ? [d, d + 1, d + 4] : c.type === 'sus4' ? [d, d + 3, d + 4] : [d, d + 2, d + 4, d + 8]; };
const maxInv = c => Math.min(3, degsOf(c).length - 1);
function chordName(c) {
  const r = NAMES[(S.root + at(c.deg)) % 12], q = qual(c.deg);
  if (c.type === 'sus2' || c.type === 'sus4') return r + c.type;
  const tri = { maj: '', min: 'm', dim: 'dim', aug: '+' }[q];
  if (c.type === 'add9') return r + tri + 'add9';
  if (c.type === '7th') { const s = rel(c.deg, c.deg + 6); const m = { maj: { 11: 'maj7', 10: '7' }, min: { 10: 'm7', 11: 'm(maj7)' }, dim: { 10: 'm7♭5', 9: 'dim7' }, aug: { 11: 'maj7♯5', 10: '7♯5' } }[q][s]; return r + (m || tri + '7'); }
  if (c.type === '9th') { const s = rel(c.deg, c.deg + 6), nine = rel(c.deg, c.deg + 8) - 12, b9 = nine === 1 ? '♭9' : nine === 3 ? '♯9' : '9'; const base = { maj: { 11: 'maj', 10: '' }, min: { 10: 'm', 11: 'm(maj)' }, dim: { 10: 'm', 9: 'dim' }, aug: { 11: 'maj', 10: '' } }[q][s] ?? tri; const fifth = q === 'dim' && s === 10 ? '♭5' : ''; return b9 === '9' ? r + base + '9' + fifth : r + base + '7' + fifth + b9; }
  return r + tri;
}
// a roman numeral with the quality from the scale; with a type the chord's suffix too
function numeral(d, type) {
  const n = iv().length, dd = ((d % n) + n) % n, q = qual(dd);
  let s = ROMAN[dd] || String(dd + 1);
  if (n === 7) { const acc = iv()[dd] - MAJ[dd]; if (acc === -1) s = '♭' + s; else if (acc === 1) s = '♯' + s; }
  if (type === 'sus2' || type === 'sus4') return s + type;
  if (q === 'min' || q === 'dim') s = s.replace(/[IVX]+/, m => m.toLowerCase());
  let suf = q === 'dim' ? '°' : q === 'aug' ? '+' : '';
  if (type === '7th') { const x = rel(dd, dd + 6); suf = q === 'dim' ? (x === 10 ? 'ø7' : '°7') : (q === 'maj' && x === 11 ? 'maj7' : '7'); }
  if (type === '9th') { const x = rel(dd, dd + 6); suf = (q === 'dim' ? 'ø' : '') + (q === 'maj' && x === 11 ? 'maj9' : '9'); }
  if (type === 'add9') suf += 'add9';
  return s + suf;
}
// the chord's notes, placed by octaves around a fixed point of the key (the Chords tab's root plus
// a sixth), not the range: + / − on the range only crop
function voice(c) {
  const base = tabs[1].rootNote;
  let notes = degsOf(c).map(k => base + at(k)).sort((a, b) => a - b);
  for (let i = 0; i < c.inv; i++) { notes[0] += 12; notes.sort((a, b) => a - b); }
  const anchor = base + 9.5;
  let best = null;
  for (let k = -4; k <= 4; k++) { const v = notes.map(n => n + 12 * k), dist = Math.abs((v[0] + v[v.length - 1]) / 2 - anchor); if (!best || dist < best.dist) best = { v, dist }; }
  return best.v;
}
const chordPcs = c => degsOf(c).map(k => (S.root + at(k)) % 12);
// the chord degree a bar starts in (the chord at its first beat, else the one that starts first in it)
const chordAtBeat = beat => chords.find(c => c.start <= beat && beat < c.start + c.len);
const firstChordIn = b => sortedChords().find(c => c.start >= b * 4 && c.start < b * 4 + 4);
const barDegree = b => { const c = chordAtBeat(b * 4) || firstChordIn(b); return c ? ((c.deg % nScale()) + nScale()) % nScale() : core.partDegree(arr[b] ?? 0, S.scale) % nScale(); };
const degreeOf = k => { const b = arr.indexOf(k); return b >= 0 ? barDegree(b) : core.partDegree(k, S.scale) % nScale(); };
const sortedChords = () => [...chords].sort((a, b) => a.start - b.start);
const total = () => arr.length * 4;
const spb = () => S.numSteps / 4;
const toSteps = x16 => Math.round(x16 * S.numSteps / 16);
// the chord hits that fall into a bar, in local steps: { s, len, c }
function barHits(b) {
  const n = S.numSteps, out = [];
  for (const c of sortedChords()) {
    const cs = c.start * spb(), ce = (c.start + c.len) * spb();
    for (const [s16, l16] of RHYTHMS[c.rhythm].f(c.len)) {
      const a = cs + toSteps(s16), l = Math.max(1, toSteps(l16));
      const local = a - b * n;
      if (local < 0 || local >= n) continue;
      out.push({ s: local, len: Math.max(1, Math.min(l, ce - a, (b + 1) * n - a)), c });
    }
  }
  return out;
}
function chordPat(b) {
  const q = newPat();
  if (b < 0) return q;
  for (const h of barHits(b)) { const st = q.steps[h.s]; st.on = true; st.length = Math.min(8, h.len); st.note = 60; }
  return q;
}
// a note moved by scale steps; an altered (off-scale) note moves with the scale note below it
function scaleStep(note, steps) {
  let alt = 0;
  while (!inScale(note - alt) && alt < 12) alt++;
  let n = note - alt;
  const dir = Math.sign(steps);
  for (let i = 0; i < Math.abs(steps); i++) { do n += dir; while (!inScale(n) && n > 0 && n < 127); }
  return n + alt;
}
const nearestOfPcs = (note, pcs, lo, hi) => { let best = note, d = Infinity; for (let n = lo; n <= hi; n++) if (pcs.includes(((n % 12) + 12) % 12) && Math.abs(n - note) < d) { d = Math.abs(n - note); best = n; } return best; };
function pairsOf(p) {
  const mv = SCALES[S.scale].moves;
  if (!mv.length) return [];
  const on = [];
  for (let i = 0; i < p.numSteps; i++) if (p.steps[i].on) on.push(i);
  const out = [];
  for (let j = 0; j + 1 < on.length; j++) {
    const a = p.steps[on[j]], b = p.steps[on[j + 1]];
    if (a.locked || b.locked || Math.abs(a.note - b.note) > 4) continue;
    const pa = pcOf(a.note), pb = pcOf(b.note);
    if (mv.some(([lo, hi]) => (lo === pa && hi === pb) || (lo === pb && hi === pa))) { out.push([on[j], on[j + 1]]); j++; }
  }
  return out;
}

// ---- the riff follows the lane -------------------------------------------------------------
// on each chord start in a bar (any beat) the riff plays a chord tone: an unlocked note there
// moves to the nearest tone, a missing note is added
function fixChordTones(k) {
  const tab = tabs[0], p = tab.parts[k], b = arr.indexOf(k);
  if (b < 0 || tab.locks[k] || !hasNotes(p)) return;
  const n = p.numSteps;
  for (const c of sortedChords()) {
    const s = c.start * spb() - b * n;
    if (s < 0 || s >= n || s !== Math.floor(s)) continue;
    const st = p.steps[s];
    if (st.locked) continue;
    const pcs = chordPcs(c);
    if (!st.on) {
      let prev = s - 1; while (prev >= 0 && !p.steps[prev].on) prev--;
      const ref = prev >= 0 ? p.steps[prev].note : Math.round((tab.lowNote + tab.highNote) / 2);
      Object.assign(st, { on: true, note: ref, length: 1, velocity: prev >= 0 ? p.steps[prev].velocity : 100, repeats: 1, locked: false });
      if (prev >= 0) p.steps[prev].length = Math.min(p.steps[prev].length, s - prev);
    }
    const want = s === 0 && S.startOnRoot ? [pcs[0]] : pcs;
    st.note = nearestOfPcs(st.note, want, tab.lowNote, tab.highNote);
  }

};

addEventListener('keydown', e => {

// playhead (no sound)
let timer = null, nextAt = 0, stepIdx = 0;
const cycleLen = () => playSeq().length * S.numSteps;
function tick() {
  const now = performance.now();
  if (now >= nextAt) {
    const n = S.numSteps, len = cycleLen();
    playPos = stepIdx % len;
    playStep = playPos % n;
    if (S.sel < 0 && arr.length && playingPart() !== S.cur) { S.cur = playingPart(); refreshPat(); }
    const stepMs = 60000 / (+$('bpm').value || 120) / S.rate;
    const swing = (playStep % 2 === 0 ? 1 : -1) * S.swing * 0.5 * stepMs;
    nextAt = (nextAt || now) + stepMs + swing;

}
$('pl').onclick = () => {
  if (timer) { cancelAnimationFrame(timer); timer = null; playStep = -1; $('pl').textContent = '▶'; $('pl').classList.remove('on'); render(); return; }
  stepIdx = 0; playPos = 0; nextAt = 0; $('pl').textContent = '■'; $('pl').classList.add('on'); tick();

// ---- MIDI import / export -------------------------------------------------------------------
function parseMidi(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let pos = 0;
  const str = n => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(u8[pos + i]); pos += n; return s; };
  const u32 = () => { const v = dv.getUint32(pos); pos += 4; return v; };
  const u16 = () => { const v = dv.getUint16(pos); pos += 2; return v; };
  const vlq = () => { let v = 0, b; do { b = u8[pos++]; v = (v << 7) | (b & 0x7f); } while (b & 0x80 && pos < u8.length); return v; };
  if (str(4) !== 'MThd') throw new Error('not a MIDI file');
  const hl = u32(); u16(); const ntr = u16(), div = u16(); pos += hl - 6;
  if (div & 0x8000) throw new Error('SMPTE timing is not supported');
  const ppq = div || 480, notes = [];
  for (let t = 0; t < ntr && pos + 8 <= u8.length; t++) {
    if (str(4) !== 'MTrk') break;
    const len = u32(), end = Math.min(u8.length, pos + len);
    let tick = 0, status = 0;
    const open = {};
    while (pos < end) {
      tick += vlq();
      let st = u8[pos];
      if (st & 0x80) { pos++; if (st < 0xf0) status = st; } else st = status;
      if (st === 0xff) { pos++; const l = vlq(); pos += l; continue; }
      if (st === 0xf0 || st === 0xf7) { const l = vlq(); pos += l; continue; }
      const hi = st & 0xf0;
      if (hi === 0x90 || hi === 0x80) {
        const note = u8[pos++], vel = u8[pos++], key = (st & 0x0f) * 128 + note;
        if (hi === 0x90 && vel > 0) { if (open[key] !== undefined) notes.push({ tick: open[key].tick, dur: Math.max(1, tick - open[key].tick), note, vel: open[key].vel }); open[key] = { tick, vel }; }
        else if (open[key] !== undefined) { notes.push({ tick: open[key].tick, dur: Math.max(1, tick - open[key].tick), note, vel: open[key].vel }); delete open[key]; }
      } else if (hi === 0xc0 || hi === 0xd0) pos += 1;
      else pos += 2;
    }
    for (const k in open) notes.push({ tick: open[k].tick, dur: ppq, note: k % 128, vel: open[k].vel });
    pos = end;
  }
  return { ppq, notes };
}
function importMidi(u8, name) {
  let m;
  try { m = parseMidi(u8); } catch (e) { say(`Could not read ${name}: ${e.message}`, true); render(); return; }

  const q = m.notes.map(x => { const s = Math.round(x.tick / stepTicks); let e = Math.round((x.tick + x.dur) / stepTicks); if (e <= s) e = s + 1; return { s, e, note: x.note, vel: x.vel }; })
    .filter(x => x.s >= 0 && x.s < MAX).sort((a, b) => a.s - b.s || a.note - b.note);
  const placed = [];
  let last = null;
  for (const x of q) {
    if (last && x.s === last.s) continue;
    if (last && x.s < last.e) { if (x.note < last.note) last.e = x.s; else continue; }
    x.e = Math.min(x.e, (Math.floor(x.s / N) + 1) * N);
    placed.push(x); last = x;
  }
  if (!placed.length) { say(`No notes found in ${name}`, true); render(); return; }
  const nBars = Math.min(4, Math.floor((Math.max(...placed.map(x => x.e)) - 1) / N) + 1);
  const w = placed.map((x, j) => ({ note: x.note, weight: (x.e - x.s) * (x.s % 4 === 0 ? 2 : 1) + (j === 0 ? 1 : 0) + (j === placed.length - 1 ? 2 : 0) }));
  const k = core.detectKey(w);
  useTab(0);
  const d = ((k.root - S.root + 18) % 12) - 6;
  if (d) shiftTab(tabs[1], d);
  S.root = k.root; S.scale = k.scale; $('scale').value = S.scale;
  const lo = Math.min(...placed.map(x => x.note)), hi = Math.max(...placed.map(x => x.note));
  T.lowNote = lo; T.highNote = Math.min(hi, lo + MAX_SPAN);
  T.rootNote = lo + ((S.root - lo) % 12 + 12) % 12;
  S.rate = 4; S.numSteps = N; $('rate').value = 4;
  const fresh = [0, 1, 2, 3].map(newPat);
  placed.forEach(x => { const b = Math.floor(x.s / N); fresh[b].steps[x.s - b * N] = { on: true, note: x.note, length: Math.min(8, x.e - x.s), velocity: Math.max(1, Math.min(127, x.vel)), repeats: 1, locked: false }; });
  T.parts = fresh; T.locks = [false, false, false, false]; T.src = [0, 1, 2, 3].map(b => b < nBars ? 'import' : 'roll');
  useTab(0);
  parts.forEach(p => { fitP(p); rebase(p); });

  chords = arr.map((kk, b) => mkChord(b * 4, 4, core.partDegree(kk, S.scale), { type: 'Triad' })); S.csel = chords[0]?.id ?? null;
  S.cur = 0; refreshPat();

  const dropped = m.notes.length - placed.length;
  say(`Imported ${nBars} bar${nBars > 1 ? 's' : ''} from ${name} → ${PARTS.slice(0, nBars).join(' ')} · key guess ${NAMES[k.root]} ${SCALES[k.scale].name} (${Math.round(k.confidence * 100)}% sure; change Key to correct it)` + (dropped > 0 ? ` · ${dropped} overlapping or late note${dropped > 1 ? 's' : ''} dropped` : ''));

}
const readFile = async f => { if (!f) return; importMidi(new Uint8Array(await f.arrayBuffer()), f.name); };
$('imp').onclick = () => $('impFile').click();
$('impFile').onchange = async () => { await readFile($('impFile').files[0]); $('impFile').value = ''; };
['dragenter', 'dragover'].forEach(ev => addEventListener(ev, e => { if ([...e.dataTransfer.types].includes('Files')) { e.preventDefault(); document.body.classList.add('dragging'); } }));
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dragging'); readFile(e.dataTransfer.files[0]); });

// One format-1 .mid: a tempo track, then a track per tab that is on. The Chords track is the lane
// (every voiced note, the range only crops the view).
function exportMidi() {
  const on = tabs.filter(t => t.on);
  if (!on.length) { say('No tab is on: turn one on in the tab bar to export', true); render(); return; }
  const PPQ = 480, stepT = PPQ * 4 / S.numSteps, bpm = +$('bpm').value || 120;
  const seq = arr.length ? arr : [S.cur];
  const bytes = [];
  const vlq = v => { const out = [v & 0x7f]; while ((v >>= 7) > 0) out.unshift((v & 0x7f) | 0x80); return out; };
  const u32 = v => [(v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255];
  const track = events => { const body = []; let last = 0; events.forEach(e => { body.push(...vlq(e.tick - last), ...e.data); last = e.tick; }); body.push(0, 0xff, 0x2f, 0); return [0x4d, 0x54, 0x72, 0x6b, ...u32(body.length), ...body]; };
  const text = s => [...new TextEncoder().encode(s)];
  const usPerBeat = Math.round(60000000 / bpm);
  const tempo = [{ tick: 0, data: [0xff, 0x51, 3, (usPerBeat >> 16) & 255, (usPerBeat >> 8) & 255, usPerBeat & 255] }, { tick: 0, data: [0xff, 0x58, 4, 4, 2, 24, 8] }];
  bytes.push(0x4d, 0x54, 0x68, 0x64, ...u32(6), 0, 1, 0, on.length + 1, (PPQ >> 8) & 255, PPQ & 255, ...track(tempo));
  on.forEach(tab => {
    const ch = tab.ch - 1, ev = [];
    const name = text(`Midinja ${tab.name}`);
    ev.push({ tick: 0, data: [0xff, 0x03, ...vlq(name.length), ...name] });
    const add = (startStep, lenSteps, notes, vel, reps) => {
      const start = Math.round(startStep * stepT + (startStep % 2 ? S.swing * 0.5 * stepT : 0));
      const tot = Math.round(lenSteps * stepT), each = Math.floor(tot / reps);
      for (let r = 0; r < reps; r++) notes.forEach(note => { const nte = Math.max(0, Math.min(127, note)); ev.push({ tick: start + r * each, pri: 1, data: [0x90 | ch, nte, vel] }); ev.push({ tick: start + r * each + Math.max(1, each - 1), pri: 0, data: [0x80 | ch, nte, 0] }); });
    };
    if (tab.poly) {
      if (arr.length) for (let b = 0; b < arr.length; b++) for (const h of barHits(b)) add(b * S.numSteps + h.s, h.len, voice(h.c), 100, 1);
    } else seq.forEach((k, bar) => { const p = tab.parts[k]; for (let s = 0; s < p.numSteps; s++) { const st = p.steps[s]; if (st.on) add(bar * p.numSteps + s, st.length, [st.note], st.velocity, Math.max(1, st.repeats)); } });
    ev.sort((a, b) => a.tick - b.tick || (a.pri || 0) - (b.pri || 0));
    bytes.push(...track(ev));
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([new Uint8Array(bytes)], { type: 'audio/midi' }));
  a.download = `midinja-${NAMES[S.root].replace('#', 's')}-${SCALES[S.scale].name.replace(/[^A-Za-z0-9]+/g, '')}.mid`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  say('Saved ' + a.download);
  render();
}
$('exp').onclick = exportMidi;

function plugScale() { const w = document.documentElement.clientWidth; return Math.min(1, (w - 24) / 1220); }
function fitW() {
  const w = document.documentElement.clientWidth, narrow = w < 720, k = narrow ? 1 : plugScale();
  plug.classList.toggle('narrow', narrow); plug.style.width = narrow ? (w - 24) + 'px' : '';
  plug.style.transformOrigin = '0 0'; plug.style.transform = k < 1 ? `scale(${k})` : '';

// a new riff: one bar A on the Riff tab, its chord (i, a whole bar) in the lane

if (h.includes('advanced')) S.adv = true;
{
  useTab(0);
  chords = [mkChord(0, 4, 0, { type: 'Triad' })]; S.csel = chords[0].id;
  const g = settings(); g.degree = degreeOf(0);
